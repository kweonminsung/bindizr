apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bindizr-chart.fullname" . }}
  labels:
    {{- include "bindizr-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: bindizr
spec:
  replicas: {{ .Values.bindizr.replicas }}
  selector:
    matchLabels:
      {{- include "bindizr-chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bindizr
  template:
    metadata:
      labels:
        {{- include "bindizr-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bindizr
      annotations:
        # A changed configuration rolls the pods; the daemon reads it at start.
        checksum/config: {{ include (print $.Template.BasePath "/bindizr-configmap.yaml") . | sha256sum }}
        {{- with .Values.bindizr.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.bindizr.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "bindizr-chart.serviceAccountName" . }}
      # No pod calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.bindizr.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bindizr
          image: "{{ .Values.bindizr.image.repository }}:{{ .Values.bindizr.image.tag }}"
          imagePullPolicy: {{ .Values.bindizr.image.pullPolicy }}
          command:
            - bindizr
            - start
            - --config
            - /etc/bindizr-template/bindizr.conf.toml
          ports:
            - name: api
              containerPort: {{ .Values.bindizr.api.port }}
              protocol: TCP
            - name: dns-tcp
              containerPort: {{ .Values.bindizr.dns.port }}
              protocol: TCP
            - name: dns-udp
              containerPort: {{ .Values.bindizr.dns.port }}
              protocol: UDP
          env:
            - name: BINDIZR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bindizr-chart.databaseSecretName" . }}
                  key: {{ .Values.bindizr.database.secretKey }}
          {{- with .Values.bindizr.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Register the secondaries over the daemon's socket once it answers;
          # one already registered takes the chart's address.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for entry in {{ include "bindizr-chart.secondaries" . }}; do
                      name="${entry%%=*}"
                      address="${entry#*=}"
                      attempt=0
                      until bindizr secondary update "$name" --address "$address" >/dev/null 2>&1 \
                        || bindizr secondary create "$name" --address "$address" >/dev/null 2>&1; do
                        attempt=$((attempt + 1))
                        if [ "$attempt" -ge 120 ]; then
                          echo "failed to register secondary $name at $address" >&2
                          exit 1
                        fi
                        sleep 1
                      done
                    done
          {{- with .Values.bindizr.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.bindizr.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.bindizr.readinessProbe }}
          readinessProbe:
            {{- /* An HTTP probe against a TLS API never passes; an explicit
                   scheme is left alone. */}}
            {{- if and $.Values.bindizr.api.tls.existingSecret .httpGet (not .httpGet.scheme) }}
            {{- toYaml (mergeOverwrite (deepCopy .) (dict "httpGet" (dict "scheme" "HTTPS"))) | nindent 12 }}
            {{- else }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.bindizr.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config-template
              mountPath: /etc/bindizr-template
              readOnly: true
            {{- with .Values.bindizr.api.tls.existingSecret }}
            - name: api-tls
              mountPath: /etc/bindizr/tls
              readOnly: true
            {{- end }}
            # The daemon's control socket: the only path a read-only root
            # filesystem has to open.
            - name: runtime
              mountPath: /run/bindizr
      volumes:
        - name: config-template
          configMap:
            name: {{ include "bindizr-chart.fullname" . }}-config
        {{- with .Values.bindizr.api.tls.existingSecret }}
        - name: api-tls
          secret:
            secretName: {{ . }}
        {{- end }}
        - name: runtime
          emptyDir: {}
      {{- with .Values.bindizr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bindizr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bindizr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
