apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bindizr-chart.fullname" . }}-config
  labels:
    {{- include "bindizr-chart.labels" . | nindent 4 }}
data:
  bindizr.conf.toml: |
    [api]
    listen_addr = "{{ .Values.bindizr.api.listenAddr }}"
    listen_port = {{ .Values.bindizr.api.port }}
    require_authentication = {{ .Values.bindizr.api.requireAuthentication }}
    metrics_enabled = {{ .Values.bindizr.api.metricsEnabled }}
    external_dns_enabled = {{ .Values.bindizr.api.externalDnsEnabled }}
    openapi_enabled = {{ .Values.bindizr.api.openapiEnabled }}

    [database]
    type = "{{ .Values.bindizr.database.type }}"

    [database.mysql]
    server_url = ""

    [database.postgresql]
    server_url = ""

    [dns]
    listen_addr = "{{ .Values.bindizr.dns.listenAddr }}"
    listen_port = {{ .Values.bindizr.dns.port }}
    secondary_addrs = "{{ include "bindizr-chart.secondaryAddrs" . }}"
    notify_after_update = {{ .Values.bindizr.dns.notifyAfterUpdate }}
    notify_on_startup = {{ .Values.bindizr.dns.notifyOnStartup }}
    notify_retries = {{ .Values.bindizr.dns.notifyRetries }}
    notify_timeout_secs = {{ .Values.bindizr.dns.notifyTimeoutSecs }}
    nsupdate_allow_unsigned = {{ .Values.bindizr.dns.nsupdateAllowUnsigned }}
    notify_mode = "{{ .Values.bindizr.dns.notifyMode }}"
    notify_batch_ms = {{ .Values.bindizr.dns.notifyBatchMs }}
    zone_cache = {{ .Values.bindizr.dns.zoneCache }}
    journal_retention_days = {{ .Values.bindizr.dns.journalRetentionDays }}

    [dnssec]
    default_signature_validity_days = {{ .Values.bindizr.dnssec.defaultSignatureValidityDays }}
    default_signature_refresh_days = {{ .Values.bindizr.dnssec.defaultSignatureRefreshDays }}
    rollover_publish_holddown_secs = {{ .Values.bindizr.dnssec.rolloverPublishHolddownSecs }}
    rollover_retire_holddown_secs = {{ .Values.bindizr.dnssec.rolloverRetireHolddownSecs }}
    default_zsk_lifetime_days = {{ .Values.bindizr.dnssec.defaultZskLifetimeDays }}
    parent_ds_resolver = "{{ .Values.bindizr.dnssec.parentDsResolver }}"
    parent_ds_auto_promote = {{ .Values.bindizr.dnssec.parentDsAutoPromote }}

    [logging]
    log_level = "{{ .Values.bindizr.logging.level }}"
