apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bindizr-chart.fullname" . }}-config
  labels:
    {{- include "bindizr-chart.labels" . | nindent 4 }}
data:
  bindizr.conf.toml: |
    [api]
    listen_addr = "{{ .Values.bindizr.api.listenAddr }}"
    listen_port = {{ int64 .Values.bindizr.api.port }}
    authentication_required = {{ .Values.bindizr.api.authenticationRequired }}
    metrics_enabled = {{ .Values.bindizr.api.metricsEnabled }}
    external_dns_enabled = {{ .Values.bindizr.api.externalDnsEnabled }}
    openapi_enabled = {{ .Values.bindizr.api.openapiEnabled }}
    {{- with .Values.bindizr.api.tls.existingSecret }}

    [api.tls]
    cert_file = "/etc/bindizr/tls/tls.crt"
    key_file = "/etc/bindizr/tls/tls.key"
    {{- end }}


    [database]
    type = "{{ .Values.bindizr.database.type }}"

    [database.mysql]
    url = ""

    [database.postgresql]
    url = ""
    {{- if or .Values.bindizr.database.tls.mode .Values.bindizr.database.tls.existingSecret }}

    [database.tls]
    {{- with .Values.bindizr.database.tls.mode }}
    mode = "{{ . }}"
    {{- end }}
    {{- if .Values.bindizr.database.tls.existingSecret }}
    ca_file = "/etc/bindizr/db-tls/ca.crt"
    {{- end }}
    {{- end }}

    [dns]
    listen_addr = "{{ .Values.bindizr.dns.listenAddr }}"
    listen_port = {{ int64 .Values.bindizr.dns.port }}
    catalog_zone_name = {{ .Values.bindizr.dns.catalogZoneName | toString | mustToJson }}
    scheduler_interval_secs = {{ int64 .Values.bindizr.dns.schedulerIntervalSecs }}
    tcp_idle_timeout_secs = {{ int64 .Values.bindizr.dns.tcpIdleTimeoutSecs }}
    tcp_max_connections = {{ int64 .Values.bindizr.dns.tcpMaxConnections }}


    [dns.notify]
    batch_ms = {{ int64 .Values.bindizr.dns.notify.batchMs }}
    retries = {{ int64 .Values.bindizr.dns.notify.retries }}
    timeout_secs = {{ int64 .Values.bindizr.dns.notify.timeoutSecs }}

    [dns.nsupdate]
    tsig_required = {{ .Values.bindizr.dns.nsupdateTsigRequired }}
    {{- with .Values.bindizr.dns.tls.existingSecret }}

    [dns.tls]
    listen_port = {{ int64 $.Values.bindizr.dns.tls.port }}
    cert_file = "/etc/bindizr/dns-tls/tls.crt"
    key_file = "/etc/bindizr/dns-tls/tls.key"
    {{- end }}

    [dns.transfer]
    cache_max_records = {{ int64 .Values.bindizr.dns.transfer.cacheMaxRecords }}
    tls_required = {{ .Values.bindizr.dns.transfer.tlsRequired }}

    [dns.import]
    timeout_secs = {{ int64 .Values.bindizr.dns.import.timeoutSecs }}
    max_records = {{ int64 .Values.bindizr.dns.import.maxRecords }}

    [dns.zone_defaults]
    default_ttl = {{ int64 .Values.bindizr.zoneDefaults.defaultTtl }}
    refresh = {{ int64 .Values.bindizr.zoneDefaults.refresh }}
    retry = {{ int64 .Values.bindizr.zoneDefaults.retry }}
    expire = {{ int64 .Values.bindizr.zoneDefaults.expire }}
    minimum_ttl = {{ int64 .Values.bindizr.zoneDefaults.minimumTtl }}

    [history]
    max_days = {{ int64 .Values.bindizr.history.maxDays }}

    [activity_log]
    max_days = {{ int64 .Values.bindizr.activityLog.maxDays }}

    [access_log]
    save = "{{ .Values.bindizr.accessLog.save }}"
    max_days = {{ int64 .Values.bindizr.accessLog.maxDays }}

    [transfer_log]
    save = "{{ .Values.bindizr.transferLog.save }}"
    max_days = {{ int64 .Values.bindizr.transferLog.maxDays }}

    [logging]
    level = "{{ .Values.bindizr.logging.level }}"
    format = "{{ .Values.bindizr.logging.format }}"
