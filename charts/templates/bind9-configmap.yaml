{{- if lt (.Values.bind9.replicas | int) 1 }}
{{- fail "bind9.replicas must be at least 1" }}
{{- end }}
{{- $catalogZoneName := .Values.bindizr.dns.catalogZoneName | toString }}
{{- $catalogName := include "bindizr-chart.bind9ZoneName" $catalogZoneName }}
{{- $catalogFile := $catalogZoneName }}
{{- /* Keep existing files for ordinary names. Use a path-safe basename for other names. */ -}}
{{- if not (regexMatch `^[A-Za-z0-9._-]{1,250}$` $catalogFile) }}
{{- $catalogFile = printf "catalog-%s" (sha256sum $catalogZoneName) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bindizr-chart.fullname" . }}-bind9-config
  labels:
    {{- include "bindizr-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: bind9
data:
  named.conf: |
    options {
      // On the persistent volume, so a restarted pod answers before its first transfer.
      directory "/var/lib/bind";
      listen-on port 53 { any; };
      listen-on-v6 port 53 { any; };
      recursion no;
      allow-query { any; };
      allow-notify { any; };
      ixfr-from-differences yes;

      catalog-zones {
        zone {{ $catalogName }} default-primaries { __BINDIZR_DNS_ADDR__ port {{ .Values.bindizr.dns.service.port }}; };
      };
    };

    zone {{ $catalogName }} {
      type secondary;
      primaries { __BINDIZR_DNS_ADDR__ port {{ .Values.bindizr.dns.service.port }}; };
      file "/var/lib/bind/{{ $catalogFile }}.zone";
      ixfr-from-differences yes;
    };
