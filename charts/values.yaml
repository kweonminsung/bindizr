nameOverride: ""
fullnameOverride: ""

bindizr:
  image:
    repository: kweonminsung/bindizr
    tag: "0.1.0-beta.7"
    pullPolicy: IfNotPresent
  replicas: 2

  api:
    listenAddr: "0.0.0.0"
    port: 8000
    requireAuthentication: true
    # Serve Prometheus metrics at GET /metrics (unauthenticated, aggregate counts only).
    metricsEnabled: true
    # ExternalDNS provider API (/external-dns), consumed by the
    # bindizr-external-dns adapter running next to external-dns.
    externalDnsEnabled: false
    # Serve the OpenAPI document at GET /openapi.json and /openapi.yaml
    # (unauthenticated; describes the whole API surface).
    openapiEnabled: false
    service:
      type: ClusterIP
      port: 8000

  dns:
    listenAddr: "0.0.0.0"
    port: 53
    notifyAfterUpdate: true
    notifyOnStartup: false
    notifyRetries: 3
    notifyTimeoutSecs: 3
    # Accept unsigned nsupdate requests (not recommended in production). TSIG
    # keys and policies are managed at runtime via the bindizr CLI or HTTP API.
    nsupdateAllowUnsigned: false
    # "sync" runs the NOTIFY inline; "async" queues it to a background worker.
    notifyMode: sync
    # async only: window to batch NOTIFYs into one per zone (0 disables the wait).
    notifyBatchMs: 50
    # Cache each zone's records by serial so repeated AXFRs skip the DB read.
    zoneCache: true
    # Days of IXFR journal/SOA history to keep (0 = unlimited).
    journalRetentionDays: 365
    service:
      port: 53

  # Whether a zone is signed is runtime state (bindizr zone dnssec ...), not
  # Helm values; the *Days knobs are defaults, per-zone overridable via
  # `bindizr zone dnssec timing`.
  dnssec:
    defaultSignatureValidityDays: 14
    defaultSignatureRefreshDays: 5
    rolloverPublishHolddownSecs: 86400
    rolloverRetireHolddownSecs: 172800
    defaultZskLifetimeDays: 0
    # Resolver (host[:port]) asked for the parent DS before ds-seen; empty
    # skips the check.
    parentDsResolver: ""
    # Poll the resolver and promote CSK/KSK rollovers unattended.
    parentDsAutoPromote: false

  logging:
    level: info

  database:
    type: postgresql
    existingSecret: ""
    secretKey: database-url
    # Used only when existingSecret is empty. Prefer an existing Secret for production.
    # If this is empty and the matching bundled mysql/postgresql database is enabled,
    # the chart builds the URL from the bundled database auth values.
    serverUrl: ""

  podAnnotations: {}
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

bindizrUi:
  enabled: false
  image:
    repository: kweonminsung/bindizr-ui
    tag: "0.1.0-beta.7"
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    goEnv: production
    port: 9000
    uiPort: 9001
  service:
    type: ClusterIP
    port: 9000
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

bind9:
  replicas: 2

  image:
    repository: internetsystemsconsortium/bind9
    tag: "9.21"
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    dnsPort: 53
    annotations: {}

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

mysql:
  enabled: false
  image:
    repository: mysql
    tag: "26.7"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  auth:
    database: bindizr
    username: bindizr
    password: bindizr
    rootPassword: bindizr-root
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  auth:
    database: bindizr
    username: bindizr
    password: bindizr
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
