nameOverride: ""
fullnameOverride: ""

bindizr:
  image:
    repository: kweonminsung/bindizr
    tag: "0.1.0-beta.7"
    pullPolicy: IfNotPresent
  replicas: 2

  api:
    listenAddr: "0.0.0.0"
    port: 8000
    requireAuthentication: true
    # Serve Prometheus metrics at GET /metrics (unauthenticated, aggregate counts only).
    metricsEnabled: true
    # ExternalDNS provider API (/external-dns), consumed by the
    # bindizr-external-dns adapter running next to external-dns.
    externalDnsEnabled: false
    # Serve the OpenAPI document at GET /openapi.json and /openapi.yaml
    # (unauthenticated; describes the whole API surface).
    openapiEnabled: false
    tls:
      # Serve the API over HTTPS from an existing Secret holding tls.crt and
      # tls.key (a cert-manager Certificate makes one). Leave empty to serve
      # plain HTTP, which is what an Ingress terminating TLS in front expects.
      existingSecret: ""
    service:
      type: ClusterIP
      port: 8000

  dns:
    listenAddr: "0.0.0.0"
    port: 53
    # Accept unsigned nsupdate requests from any client; testing only.
    nsupdateAllowUnsigned: false
    # Days of zone history kept for rollback and secondary catch-up (0 = unlimited).
    zoneHistoryRetentionDays: 365
    # Seconds between background passes (signature renewal, key rollovers,
    # history pruning). 0 stands a replica down; at least one must keep it.
    schedulerIntervalSecs: 3600
    notify:
      afterUpdate: true
      onStartup: false
      # Window (ms) to batch one zone's NOTIFYs after the write is answered;
      # 0 sends before answering.
      batchMs: 0
      retries: 3
      timeoutSecs: 3
    # Zone records cached per serial so repeated transfers skip the DB.
    transferCache:
      enabled: true
      # Records the cache may hold; a larger zone is served uncached.
      maxRecords: 500000
    service:
      port: 53

  logging:
    level: info

  database:
    type: postgresql
    existingSecret: ""
    secretKey: database-url
    # Used only when existingSecret is empty. Prefer an existing Secret for production.
    # If this is empty and the matching bundled mysql/postgresql database is enabled,
    # the chart builds the URL from the bundled database auth values.
    url: ""

  podAnnotations: {}
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      # The image sets cap_net_bind_service on the binary for port 53; with
      # an empty bounding set the kernel refuses to exec it at all.
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

  # Applied when a zone-creation request omits the field; afterwards the
  # values are the zone's own columns.
  zoneDefaults:
    ttl: 3600
    refresh: 300
    retry: 60
    expire: 3600000
    minimumTtl: 86400

  # Readiness runs /health, a database round trip, so a pod that cannot reach
  # the database stops taking traffic. Liveness deliberately does not: a
  # restart cannot fix a database outage, only spread it into a restart loop.
  readinessProbe:
    httpGet:
      path: /health
      port: api
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    tcpSocket:
      port: api
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    tcpSocket:
      port: api
    periodSeconds: 5
    failureThreshold: 30
  terminationGracePeriodSeconds: 30

  # Keeps a node drain from taking every replica at once. Ignored below two
  # replicas, where one budget or the other would block the drain outright.
  podDisruptionBudget:
    enabled: true
    spec:
      maxUnavailable: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

bindizrUi:
  enabled: false
  image:
    repository: kweonminsung/bindizr-ui
    tag: "0.1.0-beta.7"
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    goEnv: production
    port: 9000
    uiPort: 9001
  service:
    type: ClusterIP
    port: 9000
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

bind9:
  replicas: 2

  image:
    repository: internetsystemsconsortium/bind9
    tag: "9.21"
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    dnsPort: 53
    annotations: {}

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

mysql:
  enabled: false
  image:
    repository: mysql
    tag: "26.7"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  auth:
    database: bindizr
    username: bindizr
    password: bindizr
    rootPassword: bindizr-root
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  auth:
    database: bindizr
    username: bindizr
    password: bindizr
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
