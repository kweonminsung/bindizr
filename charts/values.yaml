nameOverride: ""
fullnameOverride: ""

bindizr:
  image:
    repository: kweonminsung/bindizr
    tag: "0.1.0-rc.1"
    pullPolicy: IfNotPresent
  replicas: 2

  api:
    listenAddr: "0.0.0.0"
    port: 8000
    # Require an API token; the first one is `bindizr token create` in the pod.
    authenticationRequired: true
    # Prometheus metrics at /metrics (unauthenticated).
    metricsEnabled: true
    # ExternalDNS provider API at /external-dns, for the adapter sidecar.
    externalDnsEnabled: false
    # OpenAPI document at /openapi.json and /openapi.yaml (unauthenticated).
    openapiEnabled: false
    tls:
      # A Secret holding tls.crt and tls.key (a cert-manager Certificate makes
      # one) to serve HTTPS. Empty serves plain HTTP, for an Ingress that
      # terminates TLS in front.
      existingSecret: ""
    service:
      type: ClusterIP
      port: 8000

  dns:
    listenAddr: "0.0.0.0"
    port: 53
    # The RFC 9432 catalog zone the BIND pods follow. A secondary holds one
    # zone per name, so two releases feeding one need two names.
    catalogZoneName: "catalog.bindizr"
    # Require a TSIG signature on RFC 2136 updates; false accepts them from
    # anyone (testing only).
    nsupdateTsigRequired: true
    # Days of history kept for rollback and secondary catch-up (0 = forever).
    zoneHistoryRetentionDays: 365
    # Seconds between background passes: signing, key rollover, history
    # pruning. Every replica runs the whole pass; 0 stands one down, but at
    # least one must keep it.
    schedulerIntervalSecs: 3600
    # Secondaries outside the chart, registered beside the BIND pods when a
    # bindizr pod starts; each needs a name and a host[:port] address.
    extraSecondaries: []
    # - name: ns2
    #   address: ns2.example.net:53
    # NOTIFY to the secondaries.
    notify:
      # Notify after zone changes, and for every zone at startup.
      # Window (ms) to batch a zone's NOTIFYs, sent after the write is
      # answered; 0 sends before answering.
      batchMs: 0
      retries: 3
      timeoutSecs: 3
    # Zone records cached per serial, so repeated transfers skip the database.
    transferCache:
      # Records the cache holds; a larger zone is served uncached, 0 caches nothing.
      maxRecords: 500000
    service:
      port: 53

  logging:
    level: info
    # text or json (one object per line).
    format: json

  database:
    type: postgresql
    existingSecret: ""
    secretKey: database-url
    # Used only without existingSecret, which production should prefer. Left
    # empty with a bundled mysql/postgresql enabled, the chart builds the URL
    # from that database's auth values.
    url: ""

  podAnnotations: {}
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      # The image sets cap_net_bind_service on the binary for port 53; with
      # an empty bounding set the kernel refuses to exec it at all.
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

  # Applied when a zone-creation request omits the field; afterwards the
  # values are the zone's own.
  zoneDefaults:
    ttl: 3600
    refresh: 300
    retry: 60
    expire: 3600000
    minimumTtl: 86400

  # Readiness runs /health, a database round trip, so a pod that cannot reach
  # the database stops taking traffic. Liveness deliberately does not: a
  # restart cannot fix a database outage, only spread it into a restart loop.
  readinessProbe:
    httpGet:
      path: /health
      port: api
    periodSeconds: 10
    # Longer than the handler's own 3s database budget, so a slow database
    # answers 503 instead of being cut off as a probe timeout.
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    tcpSocket:
      port: api
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    tcpSocket:
      port: api
    periodSeconds: 5
    failureThreshold: 30
  terminationGracePeriodSeconds: 30

  # Keeps a node drain from taking every replica at once. Ignored below two
  # replicas, where one budget or the other would block the drain outright.
  podDisruptionBudget:
    enabled: true
    spec:
      maxUnavailable: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

bindizrUi:
  enabled: false
  image:
    repository: kweonminsung/bindizr-ui
    tag: "0.1.0-rc.1"
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    goEnv: production
    port: 9000
    uiPort: 9001
  service:
    type: ClusterIP
    port: 9000
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

bind9:
  replicas: 2

  image:
    repository: internetsystemsconsortium/bind9
    tag: "9.21"
    pullPolicy: IfNotPresent

  # The Service clients query; NodePort where nothing provisions a load
  # balancer (kind, bare metal).
  service:
    type: LoadBalancer
    dnsPort: 53
    # With NodePort, the port for TCP and UDP alike; empty lets Kubernetes pick.
    nodePort: ""
    annotations: {}

  # A volume per pod for the transferred zones; off, an emptyDir.
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  # Without a probe the LoadBalancer sends public DNS traffic to a named that
  # has not started answering yet.
  readinessProbe:
    tcpSocket:
      port: dns-tcp
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    tcpSocket:
      port: dns-tcp
    periodSeconds: 5
    failureThreshold: 30

  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

mysql:
  enabled: false
  image:
    repository: mysql
    tag: "26.7"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  auth:
    database: bindizr
    username: bindizr
    password: bindizr
    rootPassword: bindizr-root
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  auth:
    database: bindizr
    username: bindizr
    password: bindizr
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
