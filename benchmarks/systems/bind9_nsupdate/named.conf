// BIND9 primary accepting RFC 2136 dynamic updates (nsupdate) for bench.example.
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };
    recursion no;
    allow-query { any; };
    allow-transfer { any; };
    dnssec-validation no;
    check-mx ignore;
    check-integrity no;
};

zone "bench.example" {
    type primary;
    file "/var/cache/bind/bench.example.zone";
    allow-update { any; };
    // Benchmark data has MX targets without address records; don't reject them.
    check-mx ignore;
    check-names ignore;
};
