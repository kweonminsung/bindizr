launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
gsqlite3-dnssec=yes
local-address=0.0.0.0
local-port=53
secondary=yes
# A missed NOTIFY should cost seconds rather than the default minute.
xfr-cycle-interval=10
allow-notify-from=0.0.0.0/0
# The default is loopback only, which the benchmark client is not.
allow-axfr-ips=0.0.0.0/0
loglevel=3
disable-syslog=yes
