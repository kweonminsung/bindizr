# Knot DNS as an authoritative primary accepting RFC 2136 dynamic updates.
#
# Unlike CoreDNS, Knot has a real write plane (DDNS) and keeps a journal, so it
# serves true IXFR deltas and can take part in every benchmark.
server:
    listen: 0.0.0.0@53

log:
  - target: stdout
    any: warning

acl:
  - id: acl_update
    address: 0.0.0.0/0
    action: update

  - id: acl_transfer
    address: 0.0.0.0/0
    action: transfer

template:
  - id: default
    storage: /storage

zone:
  - domain: bench.example
    file: /storage/bench.example.zone
    acl: [acl_update, acl_transfer]
    # Keep changes in the journal so IXFR serves real deltas instead of falling
    # back to AXFR, and don't rewrite the zone file on every update.
    journal-content: all
    zonefile-sync: -1
    zonefile-load: difference
    serial-policy: increment
