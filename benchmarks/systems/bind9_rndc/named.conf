// BIND9 primary managed via zone-file edits + `rndc reload` (no dynamic update).
include "/etc/bind/rndc.key";
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };
    recursion no;
    allow-query { any; };
    allow-transfer { any; };
    dnssec-validation no;
    // Benchmark data has MX targets without address records; load them anyway.
    check-mx ignore;
    check-integrity no;
    check-names primary ignore;
};

zone "bench.example" {
    type primary;
    file "/var/cache/bind/bench.example.zone";
    allow-update { none; };
};
