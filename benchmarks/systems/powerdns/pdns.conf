# PowerDNS Authoritative — gsqlite3 backend + REST API enabled.
launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3

api=yes
api-key=benchkey
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

local-address=0.0.0.0
local-port=53
loglevel=3

# Allow AXFR/IXFR from the benchmark host (Benchmarks 4 & 5).
disable-axfr=no
allow-axfr-ips=0.0.0.0/0

