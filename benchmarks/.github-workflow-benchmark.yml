# Bindizr Benchmark Suite — CI workflow.
#
# Copy or symlink this file to .github/workflows/benchmark.yml at the repo root
# to enable it (kept here so the benchmark suite is self-contained). Runs a small
# ("--ci") comparison on manual dispatch and uploads the report as an artifact.
name: benchmark

on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Space/comma-separated benchmark keys (empty = all)"
        required: false
        default: "b01_crud_tps b09_query_perf"
      systems:
        description: "Comma-separated system keys (empty = per-benchmark defaults)"
        required: false
        default: ""

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y dnsutils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        working-directory: benchmarks
        run: pip install -r requirements.txt

      - name: Run benchmarks (CI sizes)
        working-directory: benchmarks
        env:
          BENCH_CI: "1"
        run: |
          ARGS=()
          [ -n "${{ github.event.inputs.benchmarks }}" ] && ARGS+=(-b ${{ github.event.inputs.benchmarks }})
          [ -n "${{ github.event.inputs.systems }}" ] && ARGS+=(-s ${{ github.event.inputs.systems }})
          ./benchmark.sh "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
