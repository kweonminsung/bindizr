[workspace]
members = [
    "crates/bindizr",
    "crates/bindizr-e2e",
    "crates/bindizr-core",
    "crates/bindizr-db",
    "crates/bindizr-external-dns",
    "crates/bindizr-service",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
authors = ["kweonminsung"]
description = "Open-source control plane for authoritative DNS"
homepage = "https://github.com/kweonminsung/bindizr"
repository = "https://github.com/kweonminsung/bindizr"
documentation = "https://docs.rs/bindizr"
license = "Apache-2.0"
rust-version = "1.94"
keywords = ["dns", "bind9", "cli", "xfr"]
categories = ["command-line-utilities", "network-programming"]

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
redundant_clone = "warn"
inefficient_to_string = "warn"
upper_case_acronyms = "allow"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
toml = "1.0"
domain = "0.12"
hmac = "0.13"
hex = "0.4"
log = { version = "0.4", features = ["std"] }
openssl = "0.10"
prometheus = { version = "0.14", default-features = false }
rand = "0.10"
rcgen = "0.14.10"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
serial_test = "4"
sha1 = "0.11"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "mysql",
    "mysql-rsa",
    "postgres",
    "sqlite",
    "chrono",
] }
tabled = "0.22"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
utoipa = { version = "6.0", features = ["axum_extras", "chrono", "yaml"] }

[profile.dev]
split-debuginfo = "off"

[profile.release]
panic = "unwind"
