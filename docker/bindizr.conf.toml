[api]
listen_addr = "0.0.0.0"
listen_port = 8000
require_authentication = true
metrics_enabled = true
external_dns_enabled = false
openapi_enabled = false

[database]
type = "mysql"

[database.mysql]
server_url = ""

[database.sqlite]
file_path = "/var/lib/bindizr/bindizr.db"

[database.postgresql]
server_url = ""

[dns]
listen_addr = "0.0.0.0"
listen_port = 53
secondary_addrs = ""
notify_after_update = true
notify_mode = "sync"
notify_batch_ms = 50
zone_cache = true
zone_cache_max_records = 500000
notify_on_startup = false
notify_retries = 3
notify_timeout_secs = 3
nsupdate_allow_unsigned = false
journal_retention_days = 365

[dns.zone_defaults]             # Applied when a zone-creation request omits the field
ttl = 3600                    # Default record TTL (seconds)
refresh = 300                 # SOA refresh; NOTIFY drives propagation, so this only bounds a lost one
retry = 60                    # SOA retry
expire = 3600000              # SOA expire
minimum_ttl = 86400           # SOA minimum (negative-caching TTL)

[logging]
log_level = "info"
