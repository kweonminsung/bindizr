[api]
listen_addr = "0.0.0.0"
listen_port = 8000
authentication_required = true
metrics_enabled = true
external_dns_enabled = false
openapi_enabled = false


[database]
type = "sqlite"

[database.mysql]
url = ""

[database.sqlite]
file_path = "/var/lib/bindizr/bindizr.db"

[database.postgresql]
url = ""

[dns]
listen_addr = "0.0.0.0"
listen_port = 53
catalog_zone_name = "catalog.bindizr"
nsupdate_tsig_required = true  # false accepts updates from anyone (testing only)
zone_history_retention_days = 365
scheduler_interval_secs = 3600


[dns.notify]
batch_ms = 0
retries = 3
timeout_secs = 3

[dns.transfer_cache]
max_records = 500000

[dns.zone_defaults]             # Applied when a zone-creation request omits the field
ttl = 3600                    # Default record TTL (seconds)
refresh = 300                 # SOA refresh; NOTIFY drives propagation, so this only bounds a lost one
retry = 60                    # SOA retry
expire = 3600000              # SOA expire
minimum_ttl = 86400           # SOA minimum (negative-caching TTL)

[logging]
level = "info"
format = "text"
