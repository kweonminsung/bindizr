[api]
listen_addr = "0.0.0.0"
listen_port = 8000
require_authentication = true
metrics_enabled = true

[database]
type = "mysql"

[database.mysql]
server_url = ""

[database.sqlite]
file_path = "/var/lib/bindizr/bindizr.db"

[database.postgresql]
server_url = ""

[dns]
listen_addr = "0.0.0.0"
listen_port = 53
secondary_addrs = ""
notify_after_update = true
apply_mode = "sync"
apply_batch_ms = 50
zone_cache = true
notify_on_startup = false
notify_retries = 3
notify_timeout_secs = 3
nsupdate_allow_unsigned = false

[logging]
log_level = "info"
