[api]
listen_addr = "0.0.0.0"
listen_port = 8000
require_authentication = true
metrics_enabled = true
external_dns_enabled = false
openapi_enabled = false

[database]
type = "mysql"

[database.mysql]
server_url = ""

[database.sqlite]
file_path = "/var/lib/bindizr/bindizr.db"

[database.postgresql]
server_url = ""

[dns]
listen_addr = "0.0.0.0"
listen_port = 53
secondary_addrs = ""
notify_after_update = true
notify_mode = "sync"
notify_batch_ms = 50
zone_cache = true
notify_on_startup = false
notify_retries = 3
notify_timeout_secs = 3
nsupdate_allow_unsigned = false
journal_retention_days = 365

[dnssec]
signature_validity_days = 14
signature_refresh_days = 5
rollover_publish_holddown_secs = 86400
rollover_retire_holddown_secs = 172800
zsk_lifetime_days = 0

[logging]
log_level = "info"
