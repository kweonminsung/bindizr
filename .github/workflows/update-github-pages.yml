name: Update GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/openapi.yaml"
      - ".github/workflows/update-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Build OpenAPI docs
        working-directory: docs
        run: |
          mkdir -p api
          npx @redocly/cli build-docs openapi.yaml -o api/index.html

      - name: Commit & Push updated Pages artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/index.html docs/api/index.html

          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update github pages artifacts"
            git push origin ${GITHUB_REF#refs/heads/}
          else
            echo "No changes to commit."
          fi
