            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/notify:
    post:
      tags:
      - Notify
      summary: Send DNS NOTIFY messages for a zone
      operationId: notify_zone
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone to notify secondaries about.
        required: true
        schema:
          type: string
      - name: bump_serial
        in: query
        description: Bump the zone's serial first, so secondaries transfer even when nothing changed.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: DNS NOTIFY sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A global API token is required to bump a serial or to notify the catalog zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/status:
    get:
      tags:
      - Zone
      summary: Check how far each secondary has caught up with a zone
      description: Queries every configured secondary for the SOA serial it currently serves and compares it with the zone's serial. Probes run live and in parallel; an unreachable secondary is reported with the failure reason. With no secondaries configured the list is empty.
      operationId: get_zone_status
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The zone's secondary sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/token-grants:
    get:
      tags:
      - Token
      summary: List the API token grants that apply to a zone
      operationId: list_zone_token_grants
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Grants covering the zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_GetTokenGrantResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A global API token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/tsig-grants:
    get:
      tags:
      - TSIG
      summary: List the TSIG grants that apply to a zone
      operationId: list_zone_tsig_grants
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Grants covering the zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_GetTsigGrantResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A global API token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/versions:
    get:
      tags:
      - Zone
      summary: List a zone's versions (serial history)
      description: Every zone mutation records a version of the zone's SOA metadata keyed by serial. Versions are returned newest serial first.
      operationId: list_zone_versions
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Versions per page; defaults to 50.
        required: false
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 1
      - name: offset
        in: query
        description: Number of versions to skip.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: include_signer_serials
        in: query
        description: Include signer-only serials (DNSSEC re-signs and rollovers); by default only serials with user changes, plus the current serial, are listed.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: A list of zone versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_ZoneVersionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/versions/diff:
    get:
      tags:
      - Zone
      summary: Diff the records between two of a zone's serials
      description: Reports the records added, removed, and changed between `from` and `to`, grouped by name and type. Omitting `to` compares against the current serial. Each serial must be the current one or an existing version.
      operationId: diff_zone_versions
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: The serial to diff from.
        required: true
        schema:
          type: integer
          format: int32
      - name: to
        in: query
        description: The serial to diff to; defaults to the current serial.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The record differences between the two serials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDiffResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/versions/{serial}:
    get:
      tags:
      - Zone
      summary: Get the zone state captured at a version serial
      description: Returns the version's SOA fields together with the zone's records at that serial, reconstructed from the journal.
      operationId: get_zone_version
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: serial
        in: path
        description: The version serial to inspect.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The version and its reconstructed records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/versions/{serial}/rollback:
    post:
      tags:
      - Zone
      summary: Roll a zone back to a version serial
      description: Restores the zone's records and SOA metadata to the state captured at the target serial. The zone serial still advances to a new value (serials never go backward) and a single NOTIFY is sent. The zone name is not part of a version and is never changed. With `dry_run=true` the rollback is computed and reported without applying any change.
      operationId: rollback_zone
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone to roll back.
        required: true
        schema:
          type: string
      - name: serial
        in: path
        description: The version serial to roll back to.
        required: true
        schema:
          type: integer
          format: int32
      - name: dry_run
        in: query
        description: Compute and report the rollback without applying it.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Rollback result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackZoneResponse'
        '400':
          description: Bad request, invalid target serial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A global API token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Record conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    BulkRecordsResponse:
      type: object
      description: |-
        Response for a bulk insert: the count inserted and the created records. On a
        dry run `records` holds the validated would-be records (with placeholder
        IDs) and nothing is inserted.
      required:
      - applied
      - dry_run
      - inserted
      - records
      - diff
      properties:
        applied:
          type: boolean
          example: true
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: Dry-run diff; adding a value at an existing name and type is a changed group.
        dry_run:
          type: boolean
          example: false
        inserted:
          type: integer
          example: 3
          minimum: 0
        records:
          type: array
          items:
            $ref: '#/components/schemas/GetRecordResponse'
    CreateBulkRecordsRequest:
      type: object
      description: Request body for bulk-inserting records into a zone.
      required:
      - zone_name
      - records
      properties:
        dry_run:
          type: boolean
          description: When true, parse and validate without applying any change.
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordItem'
        zone_name:
          type: string
          example: example.com
      additionalProperties: false
    CreateDnssecPolicyRequest:
      type: object
      description: |-
        Request body for creating a DNSSEC policy. The key layout, algorithm,
        and denial mode are fixed once created. Omitted fields use the built-in
        defaults, independent of edits to the policy named `default`.
      required:
      - name
      properties:
        algorithm:
          type:
          - string
          - 'null'
          description: |-
            Defaults to `ecdsap256sha256`; also accepts `ecdsap384sha384`,
            `ed25519`, `ed448`, `rsasha256`, and `rsasha512`.
          example: ecdsap256sha256
        denial:
          type:
          - string
          - 'null'
          description: |-
            Denial-of-existence mode: `nsec3` (default, RFC 9276 parameters) or
            `nsec`, which leaves the zone's names walkable.
          example: nsec3
        name:
          type: string
          example: strict
        signature_refresh_days:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Re-sign when a signature has fewer than this many days left (default
            5); must be below the validity.
          example: 5
          minimum: 0
        signature_validity_days:
          type:
          - integer
          - 'null'
          format: int32
          description: Days a new signature stays valid (default 14).
          example: 14
          minimum: 0
        split_keys:
          type: boolean
          description: |-
            A KSK/ZSK pair instead of one CSK, so the ZSK rolls without touching
            the parent DS.
          example: false
        zsk_lifetime_days:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Days an active ZSK may sign before the scheduler rolls it; 0 (the
            default) disables scheduled rolls.
          example: 90
          minimum: 0
      additionalProperties: false
    CreateRecordRequest:
      type: object
      description: Request body for creating a record in a named zone.
      required:
      - name
      - type
      - value
      - zone_name
      properties:
        dry_run:
          type: boolean
          description: Validate and report the change without writing it.
          example: false
        name:
          type: string
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            MX and SRV priority, set here rather than inline in the value; other
            record types reject it. Omitted, it is served and compared as 10.
          example: 10
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional; an omitted TTL is fixed to the zone's TTL at write time. Records sharing a name and type share one TTL.
          example: 3600
        type:
          type: string
          example: A
        value:
          $ref: '#/components/schemas/RecordValueRequest'
        zone_name:
          type: string
          example: example.com
      additionalProperties: false
    CreateTokenGrantRequest:
      type: object
      description: Request body for granting an API token record rights in a zone.
      required:
      - zone_name
      properties:
        can_write:
          type: boolean
          description: |-
            Whether the grant carries write rights. A read-only grant still makes
            the zone visible, narrowed the same way. Defaults to true.
          example: true
        record_name_pattern:
          type:
          - string
          - 'null'
          description: |-
            `*` (any name), `@` (apex), `*.sub` (subtree) or an exact relative name.
            Defaults to `*`.
          example: '*.dyn'
        record_types:
          type:
          - string
          - 'null'
          description: '`*` or a comma-separated list of record types. Defaults to `*`.'
          example: A,AAAA,TXT
        zone_name:
          type: string
          description: Name of an existing zone.
          example: example.com
      additionalProperties: false
    CreateTokenRequest:
      type: object
      description: Request body for creating an API token.
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: At most 255 characters.
          example: ExternalDNS in the prod cluster
        expires_in_days:
          type:
          - integer
          - 'null'
          format: int64
          description: Days until expiry, 1 to 36500; omit for a token that never expires.
          example: 90
        global:
          type: boolean
          description: |-
            Make the token global: it may manage every zone and the zone plane.
            Fixed at creation.
          example: false
        name:
          type: string
          description: 'Letters, digits, `.`, `_`, and `-`: one URL path segment.'
          example: external-dns
      additionalProperties: false
    CreateTsigGrantRequest:
      type: object
      description: Request body for granting a TSIG key update and transfer rights in a zone.
      required:
      - zone_name
      properties:
        can_write:
          type: boolean
          description: |-
            Whether the grant carries nsupdate rights. A read-only grant over the
            whole zone still transfers it. Defaults to true.
          example: true
        record_name_pattern:
          type:
          - string
          - 'null'
          description: |-
            `*` (any name), `@` (apex), `*.sub` (subtree) or an exact relative name.
            Defaults to `*`.
          example: '*.dyn'
        record_types:
          type:
          - string
          - 'null'
          description: '`*` or a comma-separated list of record types. Defaults to `*`.'
          example: A,AAAA,TXT
        zone_name:
          type: string
          description: Name of an existing zone.
          example: example.com
      additionalProperties: false
    CreateTsigKeyRequest:
      type: object
      description: Request body for creating a TSIG key. Omitting `secret` generates one.
      required:
      - name
      properties:
        algorithm:
          type:
          - string
          - 'null'
          description: Defaults to `hmac-sha256`; also accepts `hmac-sha384` and `hmac-sha512`.
          example: hmac-sha256
        global:
          type: boolean
          description: |-
            Make the key global: it may update and transfer every zone without
            any grant. Fixed at creation.
          example: false
        name:
          type: string
          example: update-key
        secret:
          type:
          - string
          - 'null'
          description: Existing base64 secret to import; omit to generate a random one.
          example: bXktMzItYnl0ZS1pbXBvcnQtc2VjcmV0LWV4YW1wbGU=
      additionalProperties: false
    CreateZoneRequest:
      type: object
      description: Request body for creating a zone.
      required:
      - name
      - mname
      - rname
      properties:
        default_ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Record TTL the zone hands out when a record names none; defaults to
            `dns.zone_defaults.ttl`.
          example: 3600
        description:
          type:
          - string
          - 'null'
          description: Free-text note for operators, at most 255 characters.
          example: customer A, migrated 2026-01
        dry_run:
          type: boolean
          description: Validate and report the change without writing it.
          example: false
        expire:
          type:
          - integer
          - 'null'
          format: int32
          example: 604800
        minimum_ttl:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        mname:
          type: string
          example: ns1.example.com
        name:
          type: string
          example: example.com
        refresh:
          type:
          - integer
          - 'null'
          format: int32
          example: 7200
        retry:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        rname:
          type: string
          example: admin@example.com
        serial:
          type:
          - integer
          - 'null'
          format: int32
          description: Starting serial, auto-generated if not provided. Must be 1-2137483647 so the counter keeps room to advance, and can only be set at creation.
          example: 42
      additionalProperties: false
    CreatedTokenResponse:
      type: object
      description: 'The create response: the token and its secret, the one time it is shown.'
      required:
      - token
      - secret
      properties:
        secret:
          type: string
          example: k7Qm2xLp9vRt4wYz8bNc1dFg6hJs3aEu
        token:
          $ref: '#/components/schemas/GetTokenResponse'
    DeleteRecordsResponse:
      type: object
      description: |-
        What a conditional delete removed, or would have. Matching nothing is not
        an error: the zone already reads the way the request asked for, so the
        serial does not move and no NOTIFY goes out.
      required:
      - applied
      - dry_run
      - deleted
      - records
      - diff
      properties:
        applied:
          type: boolean
          description: |-
            Whether this call wrote; a filter that matched nothing still ran, and
            says so with `deleted: 0`.
          example: true
        deleted:
          type: integer
          example: 3
          minimum: 0
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: The removal as a record diff, for previewing the change.
        dry_run:
          type: boolean
          example: false
        records:
          type: array
          items:
            $ref: '#/components/schemas/GetRecordResponse'
    DeleteZoneResponse:
      type: object
      description: |-
        What deleting a zone takes with it. A dry run reports the counts and
        removes nothing; deleting a zone cannot be undone from the tool.
      required:
      - applied
      - dry_run
      - zone
      - records
      - versions
      properties:
        applied:
          type: boolean
          description: Whether this call removed the zone; a dry run answers `false`.
          example: true
        dry_run:
          type: boolean
          example: false
        records:
          type: integer
          format: int64
          description: Records the zone holds, all of which go with it.
          example: 1240
          minimum: 0
        versions:
          type: integer
          format: int64
          description: Saved versions, so the rollback history goes too.
          example: 12
          minimum: 0
        zone:
          $ref: '#/components/schemas/GetZoneResponse'
    DnssecDelegationInfo:
      type: object
      description: What the parent zone's servers answered when asked for the zone's DS.
      required:
      - parent_ns_addrs
      - ds_state
      - ds_key_tags
      - keys
      - checked_at
      properties:
        checked_at:
          type: string
          format: date-time
        ds_key_tags:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: Key tags of the DS records the parent serves.
        ds_state:
          type: string
          description: |-
            `published` when the parent serves a DS for the zone, `hidden` when
            it serves none.
          example: published
        ds_ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            TTL of the parent's DS records: how long caches may keep serving
            them once removed.
          example: 86400
          minimum: 0
        keys:
          type: array
          items:
            $ref: '#/components/schemas/DnssecDelegationKeyInfo'
          description: The zone's SEP keys, each with whether the parent serves its DS.
        parent_ns_addrs:
          type: array
          items:
            type: string
          description: The nameservers asked, from the zone's setting.
    DnssecDelegationKeyInfo:
      type: object
      description: One of the zone's SEP keys against the parent's DS records.
      required:
      - id
      - key_tag
      - role
      - state
      - ds_published
      - ds_digest_unsupported
      properties:
        ds_digest_unsupported:
          type: boolean
          description: |-
            Whether the parent serves a DS for this key tag only in digest types
            bindizr cannot compute, leaving `ds_published` undecided rather than
            answered.
          example: false
        ds_published:
          type: boolean
          description: |-
            Whether every parent server serves this key's DS (matched whole, not
            by key tag).
          example: true
        eligible_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When a `published` key's hold-down ends.
        id:
          type: integer
          format: int32
          example: 1
        key_tag:
          type: integer
          format: int32
          example: 34217
          minimum: 0
        role:
          type: string
          description: '`csk` or `ksk`.'
          example: csk
        state:
          type: string
          description: '`published`, `active`, or `retired`.'
          example: published
    DnssecDsInfo:
      type: object
      description: A key's DS form for parent-zone registration.
      required:
      - key_tag
      - algorithm
      - digest_type
      - digest
      - presentation
      properties:
        algorithm:
          type: integer
          format: int32
          example: 13
          minimum: 0
        digest:
          type: string
          example: 4B9B6B073EDD97FE1A7B19871EE93BE250E49B2D9466E661A22C74C426ACE383
        digest_type:
          type: integer
          format: int32
          description: 'DS digest type: 4 (SHA-384) for P-384 keys, otherwise 2 (SHA-256).'
          example: 2
          minimum: 0
        key_tag:
          type: integer
          format: int32
          example: 34217
        presentation:
          type: string
          description: 'Full presentation form: `<zone>. IN DS <tag> <alg> <digest_type> <digest>`.'
          example: example.com. IN DS 34217 13 2 4B9B6B073EDD97FE1A7B19871EE93BE250E49B2D9466E661A22C74C426ACE383
    DnssecKeyInfo:
      type: object
      description: Public signing-key metadata; private material is excluded from HTTP responses.
      required:
      - id
      - role
      - state
      - state_changed_at
      - algorithm
      - key_tag
      - dnskey
      - created_at
      properties:
        algorithm:
          type: string
          example: ecdsap256sha256
        created_at:
          type: string
          format: date-time
        dnskey:
          type: string
          description: |-
            Apex DNSKEY RDATA: `<flags> 3 <alg> <public key>`; flags are 256 for
            a ZSK and 257 for a CSK or KSK.
          example: 257 3 13 mdsswUyr3DPW132mOi8V9xESWE8jTo0dxCjjnopKl+GqJxpVXckHAeF+KkxLbxILfDLUT0rAK9iUzy1L53eKGQ==
        eligible_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Next allowed transition: promotion for `published`, removal for
            `retired`; absent for `active`.
        id:
          type: integer
          format: int32
          example: 1
        key_tag:
          type: integer
          format: int32
          example: 34217
        role:
          type: string
          description: '`csk`, `ksk`, or `zsk`.'
          example: csk
        state:
          type: string
          description: 'Rollover lifecycle state: `published`, `active`, or `retired`.'
          example: active
        state_changed_at:
          type: string
          format: date-time
    DnssecPolicyResponse:
      type: object
      description: A DNSSEC policy wrapped in a response envelope.
      required:
      - dnssec_policy
      properties:
        dnssec_policy:
          $ref: '#/components/schemas/GetDnssecPolicyResponse'
    DnssecStatusResponse:
      type: object
      description: A zone's DNSSEC status wrapped in a response envelope.
      required:
      - dnssec
      properties:
        dnssec:
          $ref: '#/components/schemas/GetDnssecStatusResponse'
    EnableDnssecRequest:
      type: object
      description: Request body for enabling DNSSEC on a zone.
      required:
      - parent_ns_addrs
      properties:
        parent_ns_addrs:
          type: string
          description: |-
            The parent zone's nameservers (comma-separated `host[:port]`), asked
            for the zone's DS by every later check.
          example: a.gtld-servers.net,b.gtld-servers.net
        policy:
          type:
          - string
          - 'null'
          description: Name of the DNSSEC policy to sign under; defaults to `default`.
          example: default
      additionalProperties: false
    ErrorResponse:
      type: object
      description: 'Generic error response: a plain description plus a machine-readable code.'
      required:
      - error
      - code
      properties:
        code:
          type: string
          description: |-
            One of `INVALID_INPUT`, `INVALID_ZONE_FIELD`, `INVALID_RECORD_NAME`,
            `INVALID_RECORD_VALUE`, `INVALID_JSON_BODY`, `UNAUTHORIZED`,
            `INVALID_TOKEN`, `FORBIDDEN`, `ENDPOINT_NOT_FOUND`,
            `METHOD_NOT_ALLOWED`, `ZONE_NOT_FOUND`, `RECORD_NOT_FOUND`,
            `TOKEN_NOT_FOUND`, `VERSION_NOT_FOUND`, `TSIG_KEY_NOT_FOUND`,
            `TSIG_GRANT_NOT_FOUND`, `TOKEN_GRANT_NOT_FOUND`,
            `DNSSEC_POLICY_NOT_FOUND`, `ZONE_CONFLICT`, `RECORD_CONFLICT`,
            `TOKEN_CONFLICT`, `TSIG_KEY_CONFLICT`, `TSIG_KEY_IN_USE`,
            `DNSSEC_POLICY_CONFLICT`, `DNSSEC_POLICY_IN_USE`,
            `DNSSEC_ALREADY_ENABLED`, `DNSSEC_NOT_ENABLED`,
            `DNSSEC_ROLLOVER_IN_PROGRESS`, `DNSSEC_NO_ROLLOVER_IN_PROGRESS`,
            `DNSSEC_DS_PUBLISHED`, `DNSSEC_DS_NOT_PUBLISHED`,
            `DNSSEC_DS_UNVERIFIED`, `PAYLOAD_TOO_LARGE`,
            `UNSUPPORTED_MEDIA_TYPE`, `DNSSEC_SIGNING_FAILED`, `INTERNAL`.
          example: ZONE_NOT_FOUND
          pattern: ^[A-Z_]+$
        error:
          type: string
          example: Zone with name 'example.com' not found
    ExternalDnsAdjustRequest:
      type: object
      description: Request body for canonicalizing desired records without applying them.
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
      additionalProperties: false
    ExternalDnsAdjustResponse:
      type: object
      description: The request's records in the canonical form applying them would store.
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
    ExternalDnsChangesRequest:
      type: object
      description: Request body for applying an ExternalDNS change set atomically.
      properties:
        creates:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
        deletes:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecordUpdate'
      additionalProperties: false
    ExternalDnsChangesResponse:
      type: object
      description: Summary of an applied ExternalDNS change set.
      required:
      - changed_zones
      - records_added
      - records_deleted
      properties:
        changed_zones:
          type: array
          items:
            type: string
          description: Zones whose serial advanced; empty when the request was a no-op.
          example:
          - example.com
        records_added:
          type: integer
          format: int32
          description: Counted one per value written, not per name and type.
          example: 2
          minimum: 0
        records_deleted:
          type: integer
          format: int32
          description: Counted one per value removed, not per name and type.
          example: 1
          minimum: 0
    ExternalDnsDomainsResponse:
      type: object
      description: |-
        The names the ExternalDNS caller may manage under its grants, each
        covering itself and everything under it.
      required:
      - domains
      properties:
        domains:
          type: array
          items:
            type: string
          example:
          - example.com
    ExternalDnsRecord:
      type: object
      description: |-
        One record of the ExternalDNS API: every value of one name and type. Names
        are absolute; TXT values are quoted presentation strings.
      required:
      - name
      - type
      - values
      properties:
        name:
          type: string
          example: app.example.com
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional on writes; an omitted or zero TTL resolves to the zone TTL.
          example: 300
        type:
          type: string
          example: A
        values:
          type: array
          items:
            type: string
          example:
          - 192.0.2.10
      additionalProperties: false
    ExternalDnsRecordUpdate:
      type: object
      description: 'A record replacement: `old` values are removed and `new` written in place.'
      required:
      - old
      - new
      properties:
        new:
          $ref: '#/components/schemas/ExternalDnsRecord'
        old:
          $ref: '#/components/schemas/ExternalDnsRecord'
      additionalProperties: false
    ExternalDnsRecordsResponse:
      type: object
      description: |-
        Records of every ExternalDNS-managed zone, one per name and type, in a
        deterministic order.
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
    GetDnssecPolicyResponse:
      type: object
      description: API representation of a DNSSEC policy.
      required:
      - id
      - name
      - algorithm
      - denial
      - split_keys
      - signature_validity_days
      - signature_refresh_days
      - zsk_lifetime_days
      - created_at
      properties:
        algorithm:
          type: string
          example: ecdsap256sha256
        created_at:
          type: string
          format: date-time
        denial:
          type: string
          description: '`nsec` or `nsec3`.'
          example: nsec3
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: default
        signature_refresh_days:
          type: integer
          format: int32
          example: 5
          minimum: 0
        signature_validity_days:
          type: integer
          format: int32
          example: 14
          minimum: 0
        split_keys:
          type: boolean
          example: false
        zsk_lifetime_days:
          type: integer
          format: int32
          description: 0 disables scheduled ZSK rollovers.
          example: 0
          minimum: 0
    GetDnssecStatusResponse:
      type: object
      description: DNSSEC signing state of a zone.
      required:
      - zone_name
      - enabled
      - keys
      - ds_records
      - signatures
      - expired_signatures
      - serial
      properties:
        delegation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DnssecDelegationInfo'
            description: |-
              The parent's answer about the zone's DS; present only when this
              status comes from a parent check.
        ds_records:
          type: array
          items:
            $ref: '#/components/schemas/DnssecDsInfo'
          description: DS forms of the keys, to be registered in the parent zone.
        earliest_signature_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest stored signature expiration; the re-signer renews before it.
        enabled:
          type: boolean
          example: true
        expired_signatures:
          type: integer
          format: int64
          description: |-
            Signatures already past their expiration; any at all mean resolvers
            are failing part of the zone.
          example: 0
          minimum: 0
        keys:
          type: array
          items:
            $ref: '#/components/schemas/DnssecKeyInfo'
        next_resign_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the re-signer next has work; absent for an unsigned zone.
        parent_ns_addrs:
          type:
          - string
          - 'null'
          description: Configured parent nameservers; may also be set while the zone is unsigned.
          example: a.gtld-servers.net,b.gtld-servers.net
        policy:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GetDnssecPolicyResponse'
            description: The policy the zone signs under; absent for an unsigned zone.
        serial:
          type: integer
          format: int32
          example: 7
        signatures:
          type: integer
          format: int64
          description: Signatures the zone serves.
          example: 42
          minimum: 0
        withdrawing:
          type: boolean
          description: |-
            Whether the RFC 8078 delete CDS/CDNSKEY pair is published, asking the
            parent to drop the zone's DS.
          example: false
        zone_name:
          type: string
          example: example.com
    GetRecordResponse:
