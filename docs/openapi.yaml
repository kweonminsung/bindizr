                description: Whether the key may update and transfer every zone without any grant.
                example: false
              id:
                type: integer
                format: int32
                example: 1
              name:
                type: string
                example: update-key
        pagination:
          $ref: '#/components/schemas/Pagination'
    PaginatedResponse_GetZoneResponse:
      type: object
      description: A page of items together with its pagination metadata.
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            type: object
            description: API representation of a zone.
            required:
            - name
            - mname
            - rname
            - default_ttl
            - serial
            - refresh
            - retry
            - expire
            - minimum_ttl
            - enabled
            properties:
              default_ttl:
                type: integer
                format: int32
                example: 3600
              description:
                type:
                - string
                - 'null'
              enabled:
                type: boolean
                description: |-
                  Whether the DNS plane serves the zone. A disabled one stays editable but
                  leaves the catalog and answers no transfer, so secondaries drop it.
                example: true
              expire:
                type: integer
                format: int32
                example: 604800
              id:
                type:
                - integer
                - 'null'
                format: int32
                description: Absent on a dry run, where nothing was written to carry one.
                example: 1
              minimum_ttl:
                type: integer
                format: int32
                example: 3600
              mname:
                type: string
                example: ns1.example.com
              name:
                type: string
                example: example.com
              refresh:
                type: integer
                format: int32
                example: 7200
              retry:
                type: integer
                format: int32
                example: 3600
              rname:
                type: string
                example: admin@example.com
              serial:
                type: integer
                format: int32
                example: 42
        pagination:
          $ref: '#/components/schemas/Pagination'
    PaginatedResponse_ZoneVersionResponse:
      type: object
      description: A page of items together with its pagination metadata.
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            type: object
            description: |-
              One entry of a zone's serial history, with SOA metadata in API form
              (`rname` converted back from SOA mailbox form).
            required:
            - serial
            - mname
            - rname
            - default_ttl
            - refresh
            - retry
            - expire
            - minimum_ttl
            - change_source
            - created_at
            properties:
              change_source:
                type: string
                description: |-
                  Which plane asked for this version: `token`, `nsupdate`, `system`
                  (the DNSSEC scheduler), or `local` (the daemon socket, or
                  any request while authentication is disabled).
                example: token
              changed_by:
                type:
                - string
                - 'null'
                description: |-
                  The API token or TSIG key the change was made under, absent where no
                  credential stood behind it.
                example: admin
              created_at:
                type: string
                format: date-time
              default_ttl:
                type: integer
                format: int32
                example: 3600
              expire:
                type: integer
                format: int32
                example: 604800
              minimum_ttl:
                type: integer
                format: int32
                example: 3600
              mname:
                type: string
                example: ns1.example.com
              refresh:
                type: integer
                format: int32
                example: 7200
              retry:
                type: integer
                format: int32
                example: 3600
              rname:
                type: string
                example: admin@example.com
              serial:
                type: integer
                format: int32
                example: 7
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      description: Pagination window and total count for a list response.
      required:
      - limit
      - offset
      - total
      properties:
        limit:
          type: integer
          format: int32
          example: 50
          minimum: 0
        offset:
          type: integer
          format: int64
          example: 0
          minimum: 0
        total:
          type: integer
          format: int64
          example: 125
          minimum: 0
    RecordDiff:
      type: object
      description: |-
        Record differences grouped by name and type. Version comparisons always
        populate this; mutation responses populate it only for dry-run previews.
      required:
      - entries
      - summary
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RecordDiffEntry'
        summary:
          $ref: '#/components/schemas/RecordDiffSummary'
    RecordDiffEntry:
      type: object
      description: |-
        The records of one name and type that differ, with those present on
        each side. `from` is empty for `added`, `to` for `removed`.
      required:
      - change
      - name
      - type
      - from
      - to
      properties:
        change:
          type: string
          description: '`added`, `removed`, or `changed`.'
          example: changed
        from:
          type: array
          items:
            $ref: '#/components/schemas/RecordDiffValue'
        name:
          type: string
          example: www.example.com.
        to:
          type: array
          items:
            $ref: '#/components/schemas/RecordDiffValue'
        type:
          type: string
          example: A
    RecordDiffSummary:
      type: object
      description: How many name-and-type groups of records were added, removed, and changed.
      required:
      - added
      - removed
      - changed
      properties:
        added:
          type: integer
          example: 1
          minimum: 0
        changed:
          type: integer
          example: 1
          minimum: 0
        removed:
          type: integer
          example: 1
          minimum: 0
    RecordDiffValue:
      type: object
      description: |-
        One record on one side of a diff. Rendering (zone-file rdata, priority
        placement) is left to the client; the value is in display form.
      required:
      - value
      - ttl
      properties:
        priority:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        ttl:
          type: integer
          format: int32
          example: 300
        value:
          $ref: '#/components/schemas/RecordValueRequest'
    RecordItem:
      type: object
      description: |-
        A record's data fields for a bulk insertion; the zone comes from the
        request, so unlike [`CreateRecordRequest`] it carries no `zone_name`.
      required:
      - name
      - type
      - value
      properties:
        name:
          type: string
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            MX and SRV priority, set here rather than inline in the value; other
            record types reject it. Omitted, it is served and compared as 10.
          example: 10
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional; an omitted TTL is fixed to the zone's TTL at write time. Records sharing a name and type share one TTL.
          example: 3600
        type:
          type: string
          example: A
        value:
          $ref: '#/components/schemas/RecordValueRequest'
      additionalProperties: false
    RecordResponse:
      type: object
      description: A single record wrapped in a response envelope.
      required:
      - record
      properties:
        record:
          $ref: '#/components/schemas/GetRecordResponse'
    RecordValueRequest:
      oneOf:
      - type: string
        example: 192.168.1.100
      - type: array
        items:
          type: string
        example:
        - hello
        - world
      description: 'A record value as sent by the client: a single string or TXT segments.'
    RecordWriteResponse:
      type: object
      description: |-
        What a record write left behind, in the shape every previewable operation
        answers with: whether it wrote, and the change as a record diff.
      required:
      - applied
      - dry_run
      - record
      - diff
      properties:
        applied:
          type: boolean
          description: Whether this call wrote; a dry run answers `false`.
          example: true
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: The write as a record diff, for previewing it.
        dry_run:
          type: boolean
          example: false
        record:
          $ref: '#/components/schemas/GetRecordResponse'
    RollbackSummary:
      type: object
      description: |-
        Counts of what a rollback changes. TTL-only differences count as one
        delete plus one add.
      required:
      - records_added
      - records_deleted
      - records_unchanged
      - soa_changed
      properties:
        records_added:
          type: integer
          example: 2
          minimum: 0
        records_deleted:
          type: integer
          example: 3
          minimum: 0
        records_unchanged:
          type: integer
          example: 5
          minimum: 0
        soa_changed:
          type: boolean
          example: true
    RollbackZoneResponse:
      type: object
      description: |-
        Result of a zone rollback. The zone's state returns to `target_serial`
        while its serial advances to `new_serial` (serials never go backward).
      required:
      - applied
      - dry_run
      - target_serial
      - new_serial
      - summary
      properties:
        applied:
          type: boolean
          example: true
        dry_run:
          type: boolean
          example: false
        new_serial:
          type: integer
          format: int32
          example: 13
        summary:
          $ref: '#/components/schemas/RollbackSummary'
        target_serial:
          type: integer
          format: int32
          example: 7
    RolloverDnssecRequest:
      type: object
      description: Request body for starting a key rollover.
      properties:
        role:
          type:
          - string
          - 'null'
          description: |-
            Which key to roll: required for split-key zones (`ksk` or `zsk`),
            omitted for CSK zones.
          example: zsk
      additionalProperties: false
    SecondaryStatusResponse:
      type: object
      description: Sync state of one configured secondary for a zone.
      required:
      - address
      - status
      properties:
        address:
          type: string
          example: 10.0.1.10:53
        error:
          type:
          - string
          - 'null'
        status:
          type: string
          description: '`in_sync` | `lagging` | `ahead` | `unreachable`'
          example: in_sync
        visible_serial:
          type:
          - integer
          - 'null'
          format: int64
          example: 42
    TokenGrantResponse:
      type: object
      description: A single token grant wrapped in a response envelope.
      required:
      - token_grant
      properties:
        token_grant:
          $ref: '#/components/schemas/GetTokenGrantResponse'
    TokenResponse:
      type: object
      description: 'One token without its secret: the self lookup.'
      required:
      - token
      properties:
        token:
          $ref: '#/components/schemas/GetTokenResponse'
    TsigGrantResponse:
      type: object
      description: A single TSIG grant wrapped in a response envelope.
      required:
      - tsig_grant
      properties:
        tsig_grant:
          $ref: '#/components/schemas/GetTsigGrantResponse'
    TsigKeyResponse:
      type: object
      description: 'A key with its secret: the create and get responses.'
      required:
      - tsig_key
      - secret
      properties:
        secret:
          type: string
          example: bXktMzItYnl0ZS1pbXBvcnQtc2VjcmV0LWV4YW1wbGU=
        tsig_key:
          $ref: '#/components/schemas/GetTsigKeyResponse'
    UpdateDnssecPolicyRequest:
      type: object
      description: |-
        Request body for editing a DNSSEC policy's timing; an omitted field keeps
        its value. Takes effect on the next signing pass or scheduler scan.
      properties:
        signature_refresh_days:
          type:
          - integer
          - 'null'
          format: int32
          example: 7
          minimum: 0
        signature_validity_days:
          type:
          - integer
          - 'null'
          format: int32
          example: 30
          minimum: 0
        zsk_lifetime_days:
          type:
          - integer
          - 'null'
          format: int32
          example: 90
          minimum: 0
      additionalProperties: false
    UpdateDnssecSettingsRequest:
      type: object
      description: |-
        Request body for changing a zone's signing settings; an omitted field
        keeps its value.
      properties:
        parent_ns_addrs:
          type:
          - string
          - 'null'
          description: |-
            The parent zone's nameservers (comma-separated `host[:port]`); must
            name at least one server.
          example: a.gtld-servers.net,b.gtld-servers.net
        policy:
          type:
          - string
          - 'null'
          description: |-
            Policy to move the signed zone to; it must share the zone's key
            layout. A new denial mode replaces the chain under one serial, and a
            new algorithm starts a rollover.
          example: strict
      additionalProperties: false
    UpdateRecordRequest:
      type: object
      description: |-
        Request body for updating a record; an omitted field keeps the current
        value, merged inside the update transaction. `value` is required when
        `type` changes.
      properties:
        dry_run:
          type: boolean
          description: Validate and report the change without writing it.
          example: false
        name:
          type:
          - string
          - 'null'
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: MX and SRV priority; other record types reject it.
          example: 10
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Records sharing a name and type share one TTL.
          example: 3600
        type:
          type:
          - string
          - 'null'
          example: A
        value:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RecordValueRequest'
      additionalProperties: false
    UpdateZoneRequest:
      type: object
      description: |-
        Request body for updating a zone; an omitted field keeps the current
        value, merged inside the update transaction. `serial` is carried only to
        be rejected: it is fixed at creation.
      properties:
        default_ttl:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        description:
          type:
          - string
          - 'null'
          description: Empty clears the note.
          example: customer A, migrated 2026-01
        dry_run:
          type: boolean
          description: Validate and report the change without writing it.
          example: false
        enabled:
          type:
          - boolean
          - 'null'
          description: '`false` stops the DNS plane serving the zone without deleting it.'
          example: true
        expire:
          type:
          - integer
          - 'null'
          format: int32
          example: 604800
        minimum_ttl:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        mname:
          type:
          - string
          - 'null'
          example: ns1.example.com
        name:
          type:
          - string
          - 'null'
          description: A different name renames the zone.
          example: example.com
        refresh:
          type:
          - integer
          - 'null'
          format: int32
          example: 7200
        retry:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        rname:
          type:
          - string
          - 'null'
          example: admin@example.com
        serial:
          type:
          - integer
          - 'null'
          format: int32
          example: 42
      additionalProperties: false
    VersionDetailResponse:
      type: object
      description: One version plus the reconstructed records at that serial.
      required:
      - version
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/VersionRecordResponse'
        version:
          $ref: '#/components/schemas/ZoneVersionResponse'
    VersionDiffResponse:
      type: object
      description: The difference between two of a zone's serials.
      required:
      - from_serial
      - to_serial
      - diff
      properties:
        diff:
          $ref: '#/components/schemas/RecordDiff'
        from_serial:
          type: integer
          format: int32
          example: 41
        to_serial:
          type: integer
          format: int32
          example: 42
    VersionRecordResponse:
      type: object
      description: |-
        A record reconstructed from the zone's journal; unlike stored
        records it has no database id.
      required:
      - name
      - type
      - value
      - ttl
      properties:
        name:
          type: string
          example: www
        priority:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        ttl:
          type: integer
          format: int32
          example: 3600
        type:
          type: string
          example: A
        value:
          $ref: '#/components/schemas/RecordValueRequest'
    ZoneResponse:
      type: object
      description: |-
        A single zone wrapped in a response envelope. A dry run answers with the
        zone as it would stand and `applied: false`.
      required:
      - zone
      properties:
        zone:
          $ref: '#/components/schemas/GetZoneResponse'
    ZoneStatusResponse:
      type: object
      description: |-
        A zone's serial and the sync state of every configured secondary, probed
        live via SOA queries.
      required:
      - zone
      - serial
      - secondaries
      properties:
        secondaries:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryStatusResponse'
        serial:
          type: integer
          format: int32
          example: 42
        zone:
          type: string
          example: example.com
    ZoneVersionResponse:
      type: object
      description: |-
        One entry of a zone's serial history, with SOA metadata in API form
        (`rname` converted back from SOA mailbox form).
      required:
      - serial
      - mname
      - rname
      - default_ttl
      - refresh
      - retry
      - expire
      - minimum_ttl
      - change_source
      - created_at
      properties:
        change_source:
          type: string
          description: |-
            Which plane asked for this version: `token`, `nsupdate`, `system`
            (the DNSSEC scheduler), or `local` (the daemon socket, or
            any request while authentication is disabled).
          example: token
        changed_by:
          type:
          - string
          - 'null'
          description: |-
            The API token or TSIG key the change was made under, absent where no
            credential stood behind it.
          example: admin
        created_at:
          type: string
          format: date-time
        default_ttl:
          type: integer
          format: int32
          example: 3600
        expire:
          type: integer
          format: int32
          example: 604800
        minimum_ttl:
          type: integer
          format: int32
          example: 3600
        mname:
          type: string
          example: ns1.example.com
        refresh:
          type: integer
          format: int32
          example: 7200
        retry:
          type: integer
          format: int32
          example: 3600
        rname:
          type: string
          example: admin@example.com
        serial:
          type: integer
          format: int32
          example: 7
    ZoneWriteResponse:
      type: object
      description: |-
        What a zone write left behind. The zone's own fields are the change, so
        unlike a record write this carries no diff.
      required:
      - applied
      - dry_run
      - zone
      properties:
        applied:
          type: boolean
          description: Whether this call wrote; a dry run answers `false`.
          example: true
        dry_run:
          type: boolean
          example: false
        zone:
          $ref: '#/components/schemas/GetZoneResponse'
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
security:
- bearer_auth: []
tags:
- name: Health
  description: Service health probe for load balancers and orchestrators.
- name: Zone
  description: Manage DNS zones including creation, update, deletion, and retrieval.
- name: Record
  description: Manage DNS records including creation, update, deletion, and retrieval.
- name: Notify
  description: Send DNS NOTIFY messages to secondary servers.
- name: TSIG
  description: Manage TSIG keys and the zone grants each holds for nsupdate.
- name: Token
  description: API tokens and the zone grants each holds.
- name: DNSSEC
  description: 'DNSSEC policies (the signing-parameter bundles zones sign under) and per-zone signing: enable, disable, status, DS records for the parent zone and the parent''s check of them, key rollover, and re-signing.'
- name: ExternalDNS
  description: Provider endpoints for the ExternalDNS webhook adapter; registered only when api.external_dns_enabled is set.
