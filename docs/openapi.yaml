      tags:
      - DNSSEC
      summary: Ask the parent zone whether it serves the zone's DS
      description: 'Asks the zone''s parent nameservers (`parent_ns_addrs`) for the zone''s DS records and reports the answer in `delegation`: `published` with the key tags and TTL served, or `hidden`. The same check gates disabling DNSSEC.'
      operationId: check_dnssec_ds
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The parent's answer with the zone's DNSSEC status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNSSEC is not enabled for the zone, or the parent could not be asked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/dnssec/rollover:
    post:
      tags:
      - DNSSEC
      summary: Start a key rollover for a zone
      description: Pre-publishes a same-algorithm replacement key (RFC 7583) that signs no zone data until promoted; `role` selects the key for split-key zones. To change the algorithm, move the zone to a policy of the new algorithm (`policy_name` in `PUT /zones/{name}/dnssec`), which double-signs the zone through the transition (RFC 6840, Section 5.11).
      operationId: start_dnssec_rollover
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloverDnssecRequest'
        required: true
      responses:
        '200':
          description: Rollover started, replacement key pre-published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '400':
          description: Bad request, invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNSSEC is not enabled for the zone, or a rollover is already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type, expected JSON request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/dnssec/rollover/ds-seen:
    post:
      tags:
      - DNSSEC
      summary: Confirm the new DS is at the parent (ds-seen)
      description: Promotes the pre-published key to active and retires the key it replaces, once the publish wait has passed and every one of the zone's parent nameservers (`parent_ns_addrs`) serves the new key's DS. The scheduler applies the same two conditions on every pass, so this is the way to finish a rollover now rather than the only way to finish it; refused with `DNSSEC_DS_NOT_PUBLISHED` while they do not, or `DNSSEC_DS_UNVERIFIED` when they cannot be asked or answer only in a digest type bindizr cannot compute. `skip_ds_check=true` takes the DS on the caller's word; `skip_holddown=true` promotes before the hold-down passes, at the cost of validation failures at resolvers still caching the previous DNSKEY set. Waiting out the parent's DS TTL after it appears stays the caller's. Retired keys are removed automatically once caches drain — for a SEP key that includes the parent's DS TTL, read from the answer that confirmed this promotion; ZSK rollovers involve no DS and are promoted automatically after their wait.
      operationId: ds_seen_dnssec_rollover
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: skip_ds_check
        in: query
        description: Skip the parent DS check.
        required: false
        schema:
          type: boolean
      - name: skip_holddown
        in: query
        description: Promote before the publish hold-down has passed.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Rollover advanced, new key promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '400':
          description: 'Bad request: the rollover is ZSK-only (no DS to confirm), or the publish hold-down has not passed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNSSEC is not enabled for the zone, no rollover is in progress, the parent does not serve the new DS yet, or the parent could not be asked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/dnssec/sign:
    post:
      tags:
      - DNSSEC
      summary: Re-sign a zone from scratch
      description: Discards the zone's stored signatures and re-signs everything — a recovery hatch when stored signing state is doubted. Routine renewal happens automatically as records change and signatures approach expiry.
      operationId: sign_zone
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Zone signed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNSSEC is not enabled for the zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/dnssec/withdraw:
    post:
      tags:
      - DNSSEC
      summary: Publish the DS withdrawal (RFC 8078 delete CDS/CDNSKEY)
      description: Replaces the zone's CDS/CDNSKEY records with the RFC 8078 delete pair (`CDS 0 0 0 00`), asking a CDS-consuming parent to remove the zone's DS records — the first step of going insecure. Once the parent DS is gone and its TTL has passed, disable DNSSEC.
      operationId: withdraw_dnssec
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Withdrawal published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '400':
          description: Bad request, the withdrawal is already published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNSSEC is not enabled for the zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - DNSSEC
      summary: Cancel a published DS withdrawal
      description: Removes the RFC 8078 delete pair; the per-key CDS/CDNSKEY records return with this signing pass.
      operationId: cancel_dnssec_withdrawal
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Withdrawal cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '400':
          description: Bad request, no withdrawal is published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNSSEC is not enabled for the zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/export:
    get:
      tags:
      - Zone
      summary: Export a zone as BIND master-file text
      description: Renders the zone and its records as an RFC 1035 master file, the inverse of the import endpoint. With `signed`, the derived DNSSEC records (DNSKEY, RRSIG, the denial chain, CDS/CDNSKEY) are appended in presentation form — an inspection artifact, not an import input.
      operationId: export_zone
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone to export.
        required: true
        schema:
          type: string
      - name: signed
        in: query
        description: Append the derived DNSSEC records.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The zone as master-file text
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/import:
    post:
      tags:
      - Zone
      summary: Import records into a zone
      description: Reconcile records with the zone using append/upsert/replace, taken from BIND zone file text in `content` or transferred over AXFR from `from_server` (exactly one of the two; the source must allow the transfer). When applied, the zone serial is incremented once and a single NOTIFY is sent. If any record fails validation nothing is applied and the answer is 422, carrying the per-record errors. A record type bindizr does not store fails the file the same way unless `skip_unsupported` is set, which passes over those records and lists them in `skipped_records`. TTLs are decimal seconds as RFC 1035 defines them; a file using BIND's unit suffixes (`1h`) is refused — write it out in seconds first with `named-compilezone -o - <zone> <file>`.
      operationId: import_zone
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone to import records into.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportZoneRequest'
        required: true
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportZoneResponse'
        '400':
          description: Bad request, invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Record conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type, expected JSON request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The file was rejected and nothing was applied; the same body carries the per-record errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportZoneResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/notify:
    post:
      tags:
      - Notify
      summary: Send DNS NOTIFY messages for a zone
      operationId: notify_zone
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone to notify secondaries about.
        required: true
        schema:
          type: string
      - name: bump_serial
        in: query
        description: Bump the zone's serial first, so secondaries transfer even when nothing changed.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: DNS NOTIFY sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit 'zone:update' there; the catalog zone and every zone need it in all zones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/status:
    get:
      tags:
      - Zone
      summary: Check how far each secondary has caught up with a zone
      description: Queries every enabled secondary for the SOA serial it currently serves and compares it with the zone's serial. Probes run live and in parallel; an unreachable secondary is reported with the failure reason. With no enabled secondaries the list is empty.
      operationId: get_zone_status
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The zone's secondary sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/versions:
    get:
      tags:
      - Zone
      summary: List a zone's versions (serial history)
      description: Every zone mutation records a version of the zone's SOA metadata keyed by serial. Versions are returned newest serial first.
      operationId: list_zone_versions
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Versions per page; defaults to 50.
        required: false
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 1
      - name: offset
        in: query
        description: Number of versions to skip.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: include_signer_serials
        in: query
        description: Include past serials with only derived DNSSEC changes. By default these are hidden; the current serial and serials without journal entries remain visible.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: A list of zone versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_ZoneVersionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/versions/diff:
    get:
      tags:
      - Zone
      summary: Diff the records between two of a zone's serials
      description: Reports the records added, removed, and changed between `from` and `to`, grouped by name and type. Omitting `to` compares against the current serial. Each serial must be the current one or an existing version.
      operationId: diff_zone_versions
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: The serial to diff from.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: to
        in: query
        description: The serial to diff to; defaults to the current serial.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: The record differences between the two serials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDiffResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/versions/{serial}:
    get:
      tags:
      - Zone
      summary: Get the zone state captured at a version serial
      description: Returns the version's SOA fields together with the zone's records at that serial, reconstructed from the journal.
      operationId: get_zone_version
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: serial
        in: path
        description: The version serial to inspect.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: The version and its reconstructed records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/versions/{serial}/rollback:
    post:
      tags:
      - Zone
      summary: Roll a zone back to a version serial
      description: Restores the zone's records and SOA metadata to the state captured at the target serial. The zone serial still advances to a new value (serials never go backward) and a single NOTIFY is sent. The zone name is not part of a version and is never changed. With `dry_run=true` the rollback is computed and reported without applying any change.
      operationId: rollback_zone
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone to roll back.
        required: true
        schema:
          type: string
      - name: serial
        in: path
        description: The version serial to roll back to.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: dry_run
        in: query
        description: Compute and report the rollback without applying it.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Rollback result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackZoneResponse'
        '400':
          description: Bad request, invalid target serial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Record conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Action:
      type: string
      description: |-
        One operation a grant permits, spelled `<resource>:<action>`:

        - `zone:read` — read a zone's status and version history
        - `zone:create` — create zones; every zone only
        - `zone:update` — change a zone's settings, send NOTIFY, roll back a version
        - `zone:delete` — delete zones
        - `zone:transfer` — answer a TSIG-signed AXFR/IXFR; TSIG keys only
        - `record:read` — list and read records; with no name or type limit, also
          export the zone and read its versions and diffs
        - `record:create` — add records, including by import, nsupdate and ExternalDNS
        - `record:update` — change a record in place
        - `record:delete` — delete records, including by nsupdate and ExternalDNS
        - `dnssec:read` — read DNSSEC status and check the parent DS; in every zone,
          also read signing policies
        - `dnssec:manage` — enable, disable and re-sign, manage keys and rollovers;
          in every zone, also change signing policies
        - `secondary:read` — list secondaries and the transfers served them; every zone only
        - `secondary:manage` — register, change, check and remove secondaries; every zone only
        - `access:manage` — manage roles, API tokens and TSIG keys; every zone only,
          and equivalent to admin since its holder can grant itself anything
      enum:
      - zone:read
      - zone:create
      - zone:update
      - zone:delete
      - zone:transfer
      - record:read
      - record:create
      - record:update
      - record:delete
      - dnssec:read
      - dnssec:manage
      - secondary:read
      - secondary:manage
      - access:manage
    BulkRecordsResponse:
      type: object
      description: |-
        Response for a bulk insert: the count added and the created records. On a
        dry run `records` holds the validated would-be records (with placeholder
        IDs) and nothing is added.
      required:
      - applied
      - dry_run
      - added
      - records
      - diff
      properties:
        added:
          type: integer
          format: int64
          example: 3
          minimum: 0
        applied:
          type: boolean
          example: true
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: Dry-run diff; adding a value at an existing name and type is a changed group.
        dry_run:
          type: boolean
          example: false
        records:
          type: array
          items:
            $ref: '#/components/schemas/GetRecordResponse'
    ChangeActor:
      oneOf:
      - type: object
        required:
        - name
        - kind
        properties:
          kind:
            type: string
            enum:
            - token
          name:
            type: string
      - type: object
        required:
        - name
        - kind
        properties:
          kind:
            type: string
            enum:
            - tsig_key
          name:
            type: string
      description: The named credential behind a change, copied so deleting it preserves the history.
    ChangeSource:
      type: string
      description: The request path or background process that produced a zone version.
      enum:
      - api
      - socket
      - nsupdate
      - system
    CreateBulkRecordsRequest:
      type: object
      description: Request body for bulk-inserting records into a zone.
      required:
      - zone_name
      - records
      properties:
        dry_run:
          type: boolean
          description: When true, parse and validate without applying any change.
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordItem'
        zone_name:
          type: string
          example: example.com
      additionalProperties: false
    CreateDnssecPolicyRequest:
      type: object
      description: |-
        Request body for creating a DNSSEC policy. The key layout, algorithm,
        and denial mode are fixed once created. Omitted fields use the built-in
        defaults, independent of edits to the policy named `default`.
      required:
      - name
      properties:
        algorithm:
          type:
          - string
          - 'null'
          description: |-
            Defaults to `ecdsap256sha256`; also accepts `ecdsap384sha384`,
            `ed25519`, `ed448`, `rsasha256`, and `rsasha512`.
          example: ecdsap256sha256
        denial:
          type:
          - string
          - 'null'
          description: |-
            Denial-of-existence mode: `nsec3` (default, RFC 9276 parameters) or
            `nsec`, which leaves the zone's names walkable.
          example: nsec3
        name:
          type: string
          example: strict
        signature_refresh_days:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Re-sign when a signature has fewer than this many days left (default
            5); must be below the validity.
          example: 5
          minimum: 0
        signature_validity_days:
          type:
          - integer
          - 'null'
          format: int32
          description: Days a new signature stays valid (default 14).
          example: 14
          minimum: 0
        split_keys:
          type: boolean
          description: |-
            A KSK/ZSK pair instead of one CSK, so the ZSK rolls without touching
            the parent DS.
          example: false
        zsk_lifetime_days:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Days an active ZSK may sign before the scheduler rolls it; 0 (the
            default) disables scheduled rolls.
          example: 90
          minimum: 0
      additionalProperties: false
    CreateRecordRequest:
      type: object
      description: Request body for creating a record in a named zone.
      required:
      - name
      - type
      - value
      - zone_name
      properties:
        dry_run:
          type: boolean
          description: Validate and report the change without writing it.
          example: false
        name:
          type: string
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            MX and SRV priority, set here rather than inline in the value; other
            record types reject it. Omitted, it is served and compared as 10.
          example: 10
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional; an omitted TTL is fixed to the zone's TTL at write time. Records sharing a name and type share one TTL.
          example: 3600
        type:
          type: string
          example: A
        value:
          $ref: '#/components/schemas/RecordValueRequest'
        zone_name:
          type: string
          example: example.com
      additionalProperties: false
    CreateRoleGrantRequest:
      type: object
      description: Request body for granting a role actions in one zone or every zone.
      required:
      - actions
      properties:
        actions:
          type: array
          items:
            type: string
          description: The actions the grant permits, as `<resource>:<action>`.
          example:
          - record:read
          - record:create
          - record:update
          - record:delete
        record_name_pattern:
          type:
          - string
          - 'null'
          description: |-
            `*` (any name), `@` (apex), `*.sub` (subtree) or an exact relative
            name. Constrains `record:*` actions only. Defaults to `*`.
          example: '*.apps'
        record_types:
          type:
          - string
          - 'null'
          description: |-
            `*` or a comma-separated list of record types. Constrains `record:*`
            actions only. Defaults to `*`.
          example: A,AAAA,CNAME,TXT
        zone_name:
          type:
          - string
          - 'null'
          description: |-
            Name of an existing zone; omit to cover every zone, including later ones.
            `zone:create`, `secondary:*` and `access:manage` need every zone.
          example: example.com
      additionalProperties: false
    CreateRoleRequest:
      type: object
      description: Request body for creating a role.
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: At most 255 characters.
          example: ExternalDNS in the prod clusters
        name:
          type: string
          description: 'Letters, digits, `.`, `_`, and `-`: one URL path segment.'
          example: external-dns-prod
      additionalProperties: false
    CreateSecondaryRequest:
      type: object
      description: Request body for registering a secondary.
      required:
      - name
      - address
      properties:
        address:
          type: string
          description: '`host[:port]`, port 53 when left out; a hostname is resolved when used.'
          example: ns2.example.net:53
        name:
          type: string
          description: A plain identifier, since it travels in URL paths.
          example: ns2
        notify_key_name:
          type:
          - string
          - 'null'
          description: TSIG key to sign NOTIFY to this server with; omitted sends it unsigned.
          example: notify-key
      additionalProperties: false
    CreateTokenRequest:
      type: object
      description: Request body for creating an API token.
      required:
      - name
      - role_name
      properties:
        description:
          type:
          - string
          - 'null'
          description: At most 255 characters.
          example: ExternalDNS in the prod cluster
        expires_in_days:
          type:
          - integer
          - 'null'
          format: int64
          description: Days until expiry, 1 to 36500; omit for a token that never expires.
          example: 90
        name:
          type: string
          description: 'Letters, digits, `.`, `_`, and `-`: one URL path segment.'
          example: external-dns
        role_name:
          type: string
          description: The role whose grants decide what the token may do.
          example: external-dns-prod
      additionalProperties: false
    CreateTsigKeyRequest:
      type: object
      description: Request body for creating a TSIG key. Omitting `secret` generates one.
      required:
      - name
      - role_name
      properties:
        algorithm:
          type:
          - string
          - 'null'
          description: Defaults to `hmac-sha256`; also accepts `hmac-sha384` and `hmac-sha512`.
          example: hmac-sha256
        name:
          type: string
          example: update-key
        role_name:
          type: string
          description: |-
            The role whose grants decide what the key may sign; a NOTIFY-only key
            may name one without grants.
          example: rfc2136-legacy
        secret:
          type:
          - string
          - 'null'
          description: Existing base64 secret to import; omit to generate a random one.
          example: bXktMzItYnl0ZS1pbXBvcnQtc2VjcmV0LWV4YW1wbGU=
      additionalProperties: false
    CreateZoneRequest:
      type: object
      description: Request body for creating a zone.
      required:
      - name
      - mname
      - rname
      properties:
        apex_ns:
          type: boolean
          description: |-
            Start the zone with an apex NS record naming the SOA MNAME; false
            leaves every NS record to the caller.
          default: true
          example: true
        default_ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Record TTL the zone hands out when a record names none; defaults to
            `dns.zone_defaults.ttl`.
          example: 3600
        description:
          type:
          - string
          - 'null'
          description: Free-text note for operators, at most 255 characters.
          example: customer A, migrated 2026-01
        dry_run:
          type: boolean
          description: Validate and report the change without writing it.
          example: false
        expire:
          type:
          - integer
          - 'null'
          format: int32
          example: 604800
        minimum_ttl:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        mname:
          type: string
          example: ns1.example.com
        name:
          type: string
          example: example.com
        refresh:
          type:
          - integer
          - 'null'
          format: int32
          example: 7200
        retry:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        rname:
          type: string
          example: admin@example.com
        serial:
          type:
          - integer
          - 'null'
          format: int32
          description: Starting serial, auto-generated if not provided. Must be 1-2137483647 so the counter keeps room to advance, and can only be set at creation.
          example: 42
          minimum: 0
      additionalProperties: false
    CreatedTokenResponse:
      type: object
      description: 'The create response: the token and its secret, the one time it is shown.'
      required:
      - token
      - secret
      properties:
        secret:
          type: string
          example: k7Qm2xLp9vRt4wYz8bNc1dFg6hJs3aEu
        token:
          $ref: '#/components/schemas/GetTokenResponse'
    DeleteRecordsResponse:
      type: object
      description: |-
        What a conditional delete removed, or would have. Matching nothing is not
        an error: the zone already reads the way the request asked for, so the
        serial does not move and no NOTIFY goes out.
      required:
      - applied
      - dry_run
      - deleted
      - records
      - diff
      properties:
        applied:
          type: boolean
          description: |-
            Whether this call wrote; a filter that matched nothing still ran, and
            says so with `deleted: 0`.
          example: true
        deleted:
          type: integer
          format: int64
          example: 3
          minimum: 0
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: The removal as a record diff, for previewing the change.
        dry_run:
          type: boolean
          example: false
        records:
          type: array
          items:
            $ref: '#/components/schemas/GetRecordResponse'
    DeleteZoneResponse:
      type: object
      description: |-
        What deleting a zone takes with it. A dry run reports the counts and
        removes nothing; deleting a zone cannot be undone from the tool.
      required:
      - applied
      - dry_run
      - zone
      - records_deleted
      - versions_deleted
      properties:
        applied:
          type: boolean
          description: Whether this call removed the zone; a dry run answers `false`.
          example: true
        dry_run:
          type: boolean
          example: false
        records_deleted:
          type: integer
          format: int64
          description: Records the zone holds, all of which go with it.
          example: 1240
          minimum: 0
        versions_deleted:
          type: integer
          format: int64
          description: Saved versions, so the rollback history goes too.
          example: 12
          minimum: 0
        zone:
          $ref: '#/components/schemas/GetZoneResponse'
    DnssecAlgorithm:
      type: string
      description: Supported DNSSEC signing algorithms, with their IANA numbers and mnemonics.
      enum:
      - rsasha256
      - rsasha512
      - ecdsap256sha256
      - ecdsap384sha384
      - ed25519
      - ed448
    DnssecDelegationInfo:
      type: object
      description: What the parent zone's servers answered when asked for the zone's DS.
      required:
      - parent_ns_addrs
      - ds_state
      - ds_key_tags
      - keys
      - checked_at
      properties:
        checked_at:
          type: string
          format: date-time
        ds_key_tags:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: Key tags of the DS records the parent serves.
        ds_state:
          $ref: '#/components/schemas/DsState'
        ds_ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            TTL of the parent's DS records: how long caches may keep serving
            them once removed.
          example: 86400
          minimum: 0
        keys:
          type: array
          items:
            $ref: '#/components/schemas/DnssecDelegationKeyInfo'
          description: The zone's SEP keys, each with whether the parent serves its DS.
        parent_ns_addrs:
          type: array
          items:
            type: string
          description: The nameservers asked, from the zone's setting.
    DnssecDelegationKeyInfo:
      type: object
      description: One of the zone's SEP keys against the parent's DS records.
      required:
      - id
      - key_tag
      - role
      - state
      - ds_published
      - ds_digest_unsupported
      properties:
        ds_digest_unsupported:
          type: boolean
          description: |-
            Whether the parent serves a DS for this key tag only in digest types
            bindizr cannot compute, leaving `ds_published` undecided rather than
            answered.
          example: false
        ds_published:
          type: boolean
          description: |-
            Whether every parent server serves this key's DS (matched whole, not
            by key tag).
          example: true
        eligible_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When a `published` key's hold-down ends.
        id:
          type: integer
          format: int32
          example: 1
        key_tag:
          type: integer
          format: int32
          example: 34217
          minimum: 0
        role:
          $ref: '#/components/schemas/DnssecKeyRole'
        state:
          $ref: '#/components/schemas/DnssecKeyState'
    DnssecDenial:
      type: string
      description: How a signed zone proves nonexistence (denial of existence).
      enum:
      - nsec
      - nsec3
    DnssecDsInfo:
      type: object
      description: A key's DS form for parent-zone registration.
      required:
      - key_tag
      - algorithm
      - digest_type
      - digest
      - presentation
      properties:
        algorithm:
          type: integer
          format: int32
          example: 13
          minimum: 0
        digest:
          type: string
          example: 4B9B6B073EDD97FE1A7B19871EE93BE250E49B2D9466E661A22C74C426ACE383
        digest_type:
          type: integer
          format: int32
          description: 'DS digest type: 4 (SHA-384) for P-384 keys, otherwise 2 (SHA-256).'
          example: 2
          minimum: 0
        key_tag:
          type: integer
          format: int32
          example: 34217
          minimum: 0
        presentation:
          type: string
          description: 'Full presentation form: `<zone>. IN DS <tag> <alg> <digest_type> <digest>`.'
          example: example.com. IN DS 34217 13 2 4B9B6B073EDD97FE1A7B19871EE93BE250E49B2D9466E661A22C74C426ACE383
    DnssecKeyInfo:
      type: object
      description: Public signing-key metadata; private material is excluded from HTTP responses.
      required:
      - id
      - role
      - state
      - state_changed_at
      - algorithm
      - key_tag
      - dnskey
      - created_at
      properties:
        algorithm:
          $ref: '#/components/schemas/DnssecAlgorithm'
        created_at:
          type: string
          format: date-time
        dnskey:
          type: string
          description: |-
            Apex DNSKEY RDATA: `<flags> 3 <alg> <public key>`; flags are 256 for
            a ZSK and 257 for a CSK or KSK.
          example: 257 3 13 mdsswUyr3DPW132mOi8V9xESWE8jTo0dxCjjnopKl+GqJxpVXckHAeF+KkxLbxILfDLUT0rAK9iUzy1L53eKGQ==
        eligible_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Next allowed transition: promotion for `published`, removal for
            `retired`; absent for `active`.
        id:
          type: integer
          format: int32
          example: 1
        key_tag:
          type: integer
          format: int32
          example: 34217
          minimum: 0
        role:
          $ref: '#/components/schemas/DnssecKeyRole'
        state:
          $ref: '#/components/schemas/DnssecKeyState'
          description: Rollover lifecycle state.
        state_changed_at:
          type: string
          format: date-time
    DnssecKeyRole:
      type: string
      description: |-
        What a key signs: a CSK everything, a KSK/ZSK pair splits the apex DNSKEY
        records (whose signer the parent DS must name, RFC 7344, Section 4.1) from
        the zone data.
      enum:
      - csk
      - ksk
      - zsk
    DnssecKeyState:
      type: string
      description: |-
        Rollover lifecycle position (RFC 7583); a settled zone holds only
        `Active` keys.
      enum:
      - published
      - active
      - retired
    DnssecPolicyResponse:
      type: object
      description: A DNSSEC policy wrapped in a response envelope.
      required:
      - dnssec_policy
      properties:
        dnssec_policy:
          $ref: '#/components/schemas/GetDnssecPolicyResponse'
    DnssecRecordType:
      type: string
      description: |-
        The record types the signer derives; rows store the wire record type number
        (RFC 4034).
      enum:
      - RRSIG
      - NSEC
      - DNSKEY
      - NSEC3
      - NSEC3PARAM
      - CDS
      - CDNSKEY
    DnssecStatusResponse:
      type: object
      description: DNSSEC signing state of a zone.
      required:
      - zone_name
      - enabled
      - keys
      - ds_records
      - signatures
      - expired_signatures
      - serial
      properties:
        delegation:
          oneOf:
          - $ref: '#/components/schemas/DnssecDelegationInfo'
            description: |-
              The parent's answer about the zone's DS; present only when this
              status comes from a parent check.
          - type: 'null'
        ds_records:
          type: array
          items:
            $ref: '#/components/schemas/DnssecDsInfo'
          description: DS forms of the keys, to be registered in the parent zone.
        earliest_signature_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest stored signature expiration; the re-signer renews before it.
        enabled:
          type: boolean
          example: true
        expired_signatures:
          type: integer
          format: int64
          description: |-
            Signatures already past their expiration; any at all mean resolvers
            are failing part of the zone.
          example: 0
          minimum: 0
        keys:
          type: array
          items:
            $ref: '#/components/schemas/DnssecKeyInfo'
        next_resign_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the re-signer next has work; absent for an unsigned zone.
        parent_ns_addrs:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Configured parent nameservers; may also be set while the zone is unsigned.
          example:
          - a.gtld-servers.net
          - b.gtld-servers.net
        policy:
          oneOf:
          - $ref: '#/components/schemas/GetDnssecPolicyResponse'
            description: The policy the zone signs under; absent for an unsigned zone.
          - type: 'null'
        serial:
          type: integer
          format: int32
          example: 7
          minimum: 0
        signatures:
          type: integer
          format: int64
          description: Signatures the zone serves.
          example: 42
          minimum: 0
        withdrawing:
          type: boolean
          description: |-
            Whether the RFC 8078 delete CDS/CDNSKEY pair is published, asking the
            parent to drop the zone's DS.
          example: false
        zone_name:
          type: string
          example: example.com
    DsState:
      type: string
      description: Whether the parent serves a DS for the zone.
      enum:
      - published
      - hidden
    EnableDnssecRequest:
      type: object
      description: Request body for enabling DNSSEC on a zone.
      required:
      - parent_ns_addrs
      properties:
        parent_ns_addrs:
          type: array
          items:
            type: string
          description: |-
            The parent zone's nameservers as `host[:port]` entries, asked for the
            zone's DS by every later check.
          example:
          - a.gtld-servers.net
          - b.gtld-servers.net
        policy_name:
          type:
          - string
          - 'null'
          description: Name of the DNSSEC policy to sign under; defaults to `default`.
          example: default
      additionalProperties: false
    ErrorCode:
      type: string
      description: |-
        Machine-readable error codes exposed to API and CLI clients. The
        SCREAMING_SNAKE_CASE wire name is the public contract; what status a
        code answers with is each transport's own table.
      enum:
      - INVALID_INPUT
      - INVALID_ZONE_FIELD
      - INVALID_RECORD_NAME
      - INVALID_RECORD_VALUE
      - INVALID_JSON_BODY
      - ZONE_CONFLICT
      - RECORD_CONFLICT
      - TOKEN_CONFLICT
      - ENDPOINT_NOT_FOUND
      - METHOD_NOT_ALLOWED
      - ZONE_NOT_FOUND
      - RECORD_NOT_FOUND
      - TOKEN_NOT_FOUND
      - VERSION_NOT_FOUND
      - SECONDARY_NOT_FOUND
      - SECONDARY_CONFLICT
      - TSIG_KEY_NOT_FOUND
      - TSIG_KEY_CONFLICT
      - TSIG_KEY_IN_USE
      - ROLE_NOT_FOUND
      - ROLE_CONFLICT
      - ROLE_IN_USE
      - ROLE_GRANT_NOT_FOUND
      - DNSSEC_ALREADY_ENABLED
      - DNSSEC_NOT_ENABLED
      - DNSSEC_ROLLOVER_IN_PROGRESS
      - DNSSEC_NO_ROLLOVER_IN_PROGRESS
      - DNSSEC_DS_PUBLISHED
      - DNSSEC_DS_NOT_PUBLISHED
      - DNSSEC_DS_UNVERIFIED
      - DNSSEC_POLICY_NOT_FOUND
      - DNSSEC_POLICY_CONFLICT
      - DNSSEC_POLICY_IN_USE
      - DNSSEC_SIGNING_FAILED
      - UNAUTHORIZED
      - INVALID_TOKEN
      - FORBIDDEN
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - INTERNAL
    ErrorResponse:
      type: object
      description: 'Generic error response: a plain description plus a machine-readable code.'
      required:
      - error
      - code
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Machine-readable failure classification.
        error:
          type: string
          example: zone with name 'example.com' not found
    ExternalDnsAdjustRequest:
      type: object
      description: Request body for canonicalizing desired records without applying them.
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
      additionalProperties: false
    ExternalDnsAdjustResponse:
      type: object
      description: The request's records in the canonical form applying them would store.
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
    ExternalDnsChangesRequest:
      type: object
      description: Request body for applying an ExternalDNS change set atomically.
      properties:
        creates:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
        deletes:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecordUpdate'
      additionalProperties: false
    ExternalDnsChangesResponse:
      type: object
      description: Summary of an applied ExternalDNS change set.
      required:
      - changed_zones
      - added
      - deleted
      properties:
        added:
          type: integer
          format: int64
          description: Counted one per value written, not per name and type.
          example: 2
          minimum: 0
        changed_zones:
          type: array
          items:
            type: string
          description: Zones whose serial advanced; empty when the request was a no-op.
          example:
          - example.com
        deleted:
          type: integer
          format: int64
          description: Counted one per value removed, not per name and type.
          example: 1
          minimum: 0
    ExternalDnsDomainsResponse:
      type: object
      description: |-
        The names the ExternalDNS caller may manage under its grants, each
        covering itself and everything under it.
      required:
      - domains
      properties:
        domains:
          type: array
          items:
            type: string
          example:
          - example.com
    ExternalDnsRecord:
      type: object
      description: |-
        One record of the ExternalDNS API: every value of one name and type. Names
        are absolute; TXT values are quoted presentation strings.
      required:
      - name
      - type
      - values
      properties:
        name:
          type: string
          example: app.example.com
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional on writes; an omitted or zero TTL resolves to the zone TTL.
          example: 300
        type:
          type: string
          example: A
        values:
          type: array
          items:
            type: string
          example:
          - 192.0.2.10
      additionalProperties: false
    ExternalDnsRecordUpdate:
      type: object
      description: 'A record replacement: `old` values are removed and `new` written in place.'
      required:
      - old
      - new
      properties:
        new:
          $ref: '#/components/schemas/ExternalDnsRecord'
        old:
          $ref: '#/components/schemas/ExternalDnsRecord'
      additionalProperties: false
    ExternalDnsRecordsResponse:
      type: object
      description: |-
        Records of every ExternalDNS-managed zone, one per name and type, in a
        deterministic order.
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecord'
    GetDnssecPolicyResponse:
      type: object
      description: API representation of a DNSSEC policy.
      required:
      - id
      - name
      - builtin
      - algorithm
      - denial
