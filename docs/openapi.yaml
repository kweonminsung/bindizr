  /zones/{zone_name}/records/bulk:
    post:
      tags:
      - Record
      summary: Bulk insert DNS records into a zone
      description: Insert many records into a single zone in one transaction. The zone serial is incremented once and a single NOTIFY is sent. Either all records are inserted or none are. With dry_run the same validation runs but nothing is applied.
      operationId: create_records_bulk
      parameters:
      - name: zone_name
        in: path
        description: The name of the DNS zone to insert records into.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkRecordsRequest'
        required: true
      responses:
        '200':
          description: Dry run validated successfully, nothing applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRecordsResponse'
        '201':
          description: DNS records created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRecordsResponse'
        '400':
          description: Bad request, invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token's policies do not allow this record write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type, expected JSON request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    BulkRecordsResponse:
      type: object
      description: |-
        Response for a bulk insert: the count inserted and the created records. On a
        dry run `records` holds the validated would-be records (with placeholder
        IDs) and nothing is inserted.
      required:
      - applied
      - dry_run
      - inserted
      - records
      - diff
      properties:
        applied:
          type: boolean
          example: true
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: The insert as a record diff (all additions), for previewing the change.
        dry_run:
          type: boolean
          example: false
        inserted:
          type: integer
          example: 3
          minimum: 0
        records:
          type: array
          items:
            $ref: '#/components/schemas/GetRecordResponse'
    CreateBulkRecordsRequest:
      type: object
      description: Request body for bulk-inserting records into a zone.
      required:
      - records
      properties:
        dry_run:
          type: boolean
          description: When true, parse and validate without applying any change.
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordItem'
    CreateRecordRequest:
      type: object
      description: Request body for creating a record in a named zone.
      required:
      - name
      - record_type
      - value
      - zone_name
      properties:
        name:
          type: string
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: MX and SRV priority, set here rather than inline in the value; other record types reject it.
          example: 10
        record_type:
          type: string
          example: A
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional; an omitted TTL is fixed to the zone's TTL at write time. Every record of an RRset (same name and type) must share one TTL.
          example: 3600
        value:
          $ref: '#/components/schemas/RecordValueRequest'
        zone_name:
          type: string
          example: example.com
    CreateTsigKeyRequest:
      type: object
      description: Request body for creating a TSIG key. Omitting `secret` generates one.
      required:
      - name
      properties:
        algorithm:
          type:
          - string
          - 'null'
          description: Defaults to `hmac-sha256`; also accepts `hmac-sha384` and `hmac-sha512`.
          example: hmac-sha256
        global:
          type: boolean
          description: |-
            Make the key global: it may update every zone (all names, all types)
            without any policy. Fixed at creation.
          example: false
        name:
          type: string
          example: update-key
        secret:
          type:
          - string
          - 'null'
          description: Existing base64 secret to import; omit to generate a random one.
          example: bXktMzItYnl0ZS1pbXBvcnQtc2VjcmV0LWV4YW1wbGU=
    CreateZoneRequest:
      type: object
      description: Request body for creating or updating a zone.
      required:
      - name
      - primary_ns
      - admin_email
      - ttl
      properties:
        admin_email:
          type: string
          example: admin@example.com
        expire:
          type:
          - integer
          - 'null'
          format: int32
          example: 604800
        minimum_ttl:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        name:
          type: string
          example: example.com
        primary_ns:
          type: string
          example: ns1.example.com
        refresh:
          type:
          - integer
          - 'null'
          format: int32
          example: 7200
        retry:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        serial:
          type:
          - integer
          - 'null'
          format: int32
          description: Starting serial, auto-generated if not provided. Must be 1-2137483647 so the counter keeps room to advance, and can only be set at creation.
          example: 42
        ttl:
          type: integer
          format: int32
          example: 3600
    CreateZoneTokenPolicyRequest:
      type: object
      description: Request body for granting an API token record rights in a zone.
      required:
      - api_token
      properties:
        api_token:
          type: string
          description: Name of an existing non-global API token.
          example: external-dns
        record_name_pattern:
          type:
          - string
          - 'null'
          description: |-
            `*` (any name), `@` (apex), `*.sub` (subtree) or an exact relative name.
            Defaults to `*`.
          example: '*.dyn'
        record_types:
          type:
          - string
          - 'null'
          description: '`*` or a comma-separated list of record types. Defaults to `*`.'
          example: A,AAAA,TXT
    CreateZoneTsigPolicyRequest:
      type: object
      description: Request body for granting a TSIG key nsupdate rights in a zone.
      required:
      - tsig_key
      properties:
        record_name_pattern:
          type:
          - string
          - 'null'
          description: |-
            `*` (any name), `@` (apex), `*.sub` (subtree) or an exact relative name.
            Defaults to `*`.
          example: '*.dyn'
        record_types:
          type:
          - string
          - 'null'
          description: '`*` or a comma-separated list of record types. Defaults to `*`.'
          example: A,AAAA,TXT
        tsig_key:
          type: string
          description: Name of an existing TSIG key.
          example: update-key
    ErrorResponse:
      type: object
      description: 'Generic error response: a plain description plus a machine-readable code.'
      required:
      - error
      - code
      properties:
        code:
          type: string
          example: ZONE_NOT_FOUND
        error:
          type: string
          example: Zone with name 'example.com' not found
    ExternalDnsChangesRequest:
      type: object
      description: Request body for applying an ExternalDNS change set atomically.
      properties:
        creates:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRrset'
        deletes:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRrset'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRrsetUpdate'
    ExternalDnsChangesResponse:
      type: object
      description: Summary of an applied ExternalDNS change set.
      required:
      - changed_zones
      - records_added
      - records_deleted
      properties:
        changed_zones:
          type: array
          items:
            type: string
          description: Zones whose serial advanced; empty when the request was a no-op.
          example:
          - example.com
        records_added:
          type: integer
          format: int32
          example: 2
          minimum: 0
        records_deleted:
          type: integer
          format: int32
          example: 1
          minimum: 0
    ExternalDnsRecordItem:
      type: object
      description: |-
        One record row managed through the ExternalDNS API: absolute owner name
        and the value in presentation form (TXT quoted).
      required:
      - name
      - record_type
      - ttl
      - value
      properties:
        name:
          type: string
          example: app.example.com
        record_type:
          type: string
          example: A
        ttl:
          type: integer
          format: int32
          example: 300
        value:
          type: string
          example: 192.0.2.10
    ExternalDnsRecordsResponse:
      type: object
      description: Records of every ExternalDNS-managed zone, deterministically ordered.
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDnsRecordItem'
    ExternalDnsRrset:
      type: object
      description: |-
        One RRset (owner name and type) exchanged with the ExternalDNS API. Names
        are absolute; TXT values are quoted presentation strings.
      required:
      - name
      - record_type
      - values
      properties:
        name:
          type: string
          example: app.example.com
        record_type:
          type: string
          example: A
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional on writes; an omitted or zero TTL resolves to the zone TTL.
          example: 300
        values:
          type: array
          items:
            type: string
          example:
          - 192.0.2.10
    ExternalDnsRrsetUpdate:
      type: object
      description: 'An RRset replacement: `old` values are removed and `new` written in place.'
      required:
      - old
      - new
      properties:
        new:
          $ref: '#/components/schemas/ExternalDnsRrset'
        old:
          $ref: '#/components/schemas/ExternalDnsRrset'
    ExternalDnsZonesResponse:
      type: object
      description: Zones the ExternalDNS caller may manage under the current policy.
      required:
      - zones
      properties:
        zones:
          type: array
          items:
            type: string
          example:
          - example.com
    GetRecordResponse:
      type: object
      description: API representation of a record, optionally carrying its zone name.
      required:
      - id
      - name
      - record_type
      - value
      - ttl
      - zone_id
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        record_type:
          type: string
          example: A
        ttl:
          type: integer
          format: int32
          example: 3600
        value:
          $ref: '#/components/schemas/RecordValueRequest'
        zone_id:
          type: integer
          format: int32
          example: 1
        zone_name:
          type:
          - string
          - 'null'
          example: example.com
    GetTsigKeyResponse:
      type: object
      description: |-
        API representation of a TSIG key. `secret` is only present on create and
        single-key reads; list responses omit it.
      required:
      - id
      - name
      - algorithm
      - global
      - created_at
      properties:
        algorithm:
          type: string
          example: hmac-sha256
        created_at:
          type: string
          format: date-time
        global:
          type: boolean
          description: Whether the key may update every zone without any policy.
          example: false
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: update-key
        secret:
          type:
          - string
          - 'null'
          example: bXktMzItYnl0ZS1pbXBvcnQtc2VjcmV0LWV4YW1wbGU=
    GetZoneResponse:
      type: object
      description: API representation of a zone.
      required:
      - id
      - name
      - primary_ns
      - admin_email
      - ttl
      - serial
      - refresh
      - retry
      - expire
      - minimum_ttl
      properties:
        admin_email:
          type: string
          example: admin@example.com
        expire:
          type: integer
          format: int32
          example: 604800
        id:
          type: integer
          format: int32
          example: 1
        minimum_ttl:
          type: integer
          format: int32
          example: 3600
        name:
          type: string
          example: example.com
        primary_ns:
          type: string
          example: ns1.example.com
        refresh:
          type: integer
          format: int32
          example: 7200
        retry:
          type: integer
          format: int32
          example: 3600
        serial:
          type: integer
          format: int32
          example: 42
        ttl:
          type: integer
          format: int32
          example: 3600
    GetZoneTokenPolicyResponse:
      type: object
      description: API representation of a zone token policy.
      required:
      - id
      - api_token
      - record_name_pattern
      - record_types
      - created_at
      properties:
        api_token:
          type: string
          example: external-dns
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int32
          example: 1
        record_name_pattern:
          type: string
          example: '*.dyn'
        record_types:
          type: string
          example: A,AAAA,TXT
    GetZoneTsigPolicyResponse:
      type: object
      description: API representation of a zone TSIG policy.
      required:
      - id
      - tsig_key
      - record_name_pattern
      - record_types
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int32
          example: 1
        record_name_pattern:
          type: string
          example: '*.dyn'
        record_types:
          type: string
          example: A,AAAA,TXT
        tsig_key:
          type: string
          example: update-key
    HealthResponse:
      type: object
      description: Health probe response.
      required:
      - status
      properties:
        status:
          type: string
          example: healthy
    ImportMode:
      type: string
      description: How parsed records are reconciled with the records already in the zone.
      enum:
      - append
      - upsert
      - replace
    ImportSummary:
      type: object
      description: |-
        Counts of records parsed, added, deleted, updated, unchanged, and skipped
        during import. `updated` is a TTL-only reconcile and is never also counted
        as `unchanged`.
      required:
      - parsed
      - added
      - deleted
      - updated
      - unchanged
      - skipped
      properties:
        added:
          type: integer
          example: 8
          minimum: 0
        deleted:
          type: integer
          example: 2
          minimum: 0
        parsed:
          type: integer
          example: 12
          minimum: 0
        skipped:
          type: integer
          example: 0
          minimum: 0
        unchanged:
          type: integer
          example: 2
          minimum: 0
        updated:
          type: integer
          example: 1
          minimum: 0
    ImportZoneFileRequest:
      type: object
      description: Request body for importing a BIND zone file into a zone.
      required:
      - content
      properties:
        content:
          type: string
          description: Raw BIND zone file text.
          example: |
            www IN A 192.0.2.1
            mail IN A 192.0.2.2
        dry_run:
          type: boolean
          description: When true, parse and validate without applying any change.
        mode:
          $ref: '#/components/schemas/ImportMode'
    ImportZoneFileResponse:
      type: object
      description: Result of a zone-file import, including a summary and any validation errors.
      required:
      - applied
      - dry_run
      - summary
      - diff
      - errors
      properties:
        applied:
          type: boolean
          example: true
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: The reconcile as a record diff, for previewing the change.
        dry_run:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: string
          description: Per-record validation errors. When non-empty nothing is applied.
        summary:
          $ref: '#/components/schemas/ImportSummary'
    MessageResponse:
      type: object
      description: Generic success message response.
      required:
      - message
      properties:
        message:
          type: string
          example: Deleted successfully
    NotifyZoneRequest:
      type: object
      description: Request body for triggering a NOTIFY, optionally scoped to one zone.
      properties:
        force:
          type: boolean
          example: true
        zone_name:
          type:
          - string
          - 'null'
          example: example.com
    PaginatedResponse_GetRecordResponse:
      type: object
      description: A page of items together with its pagination metadata.
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            type: object
            description: API representation of a record, optionally carrying its zone name.
            required:
            - id
            - name
            - record_type
            - value
            - ttl
            - zone_id
            properties:
              id:
                type: integer
                format: int32
                example: 1
              name:
                type: string
                example: sub
              priority:
                type:
                - integer
                - 'null'
                format: int32
                example: 10
              record_type:
                type: string
                example: A
              ttl:
                type: integer
                format: int32
                example: 3600
              value:
                $ref: '#/components/schemas/RecordValueRequest'
              zone_id:
                type: integer
                format: int32
                example: 1
              zone_name:
                type:
                - string
                - 'null'
                example: example.com
        pagination:
          $ref: '#/components/schemas/Pagination'
    PaginatedResponse_GetZoneResponse:
      type: object
      description: A page of items together with its pagination metadata.
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            type: object
            description: API representation of a zone.
            required:
            - id
            - name
            - primary_ns
            - admin_email
            - ttl
            - serial
            - refresh
            - retry
            - expire
            - minimum_ttl
            properties:
              admin_email:
                type: string
                example: admin@example.com
              expire:
                type: integer
                format: int32
                example: 604800
              id:
                type: integer
                format: int32
                example: 1
              minimum_ttl:
                type: integer
                format: int32
                example: 3600
              name:
                type: string
                example: example.com
              primary_ns:
                type: string
                example: ns1.example.com
              refresh:
                type: integer
                format: int32
                example: 7200
              retry:
                type: integer
                format: int32
                example: 3600
              serial:
                type: integer
                format: int32
                example: 42
              ttl:
                type: integer
                format: int32
                example: 3600
        pagination:
          $ref: '#/components/schemas/Pagination'
    PaginatedResponse_ZoneSnapshotResponse:
      type: object
      description: A page of items together with its pagination metadata.
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            type: object
            description: |-
              One entry of a zone's serial history, with SOA metadata in API form
              (`admin_email` converted back from SOA mailbox form).
            required:
            - serial
            - primary_ns
            - admin_email
            - ttl
            - refresh
            - retry
            - expire
            - minimum_ttl
            - created_at
            properties:
              admin_email:
                type: string
                example: admin@example.com
              created_at:
                type: string
                format: date-time
              expire:
                type: integer
                format: int32
                example: 604800
              minimum_ttl:
                type: integer
                format: int32
                example: 3600
              primary_ns:
                type: string
                example: ns1.example.com
              refresh:
                type: integer
                format: int32
                example: 7200
              retry:
                type: integer
                format: int32
                example: 3600
              serial:
                type: integer
                format: int32
                example: 7
              ttl:
                type: integer
                format: int32
                example: 3600
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      description: Pagination window and total count for a list response.
      required:
      - limit
      - offset
      - total
      properties:
        limit:
          type: integer
          format: int32
          example: 50
          minimum: 0
        offset:
          type: integer
          format: int64
          example: 0
          minimum: 0
        total:
          type: integer
          format: int64
          example: 125
          minimum: 0
    RecordDiff:
      type: object
      description: |-
        A record-level difference between two record sets, RRset by RRset. Empty on
        a real apply, which does not need it; populated only for a dry-run preview.
      required:
      - entries
      - summary
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RecordDiffEntry'
        summary:
          $ref: '#/components/schemas/RecordDiffSummary'
    RecordDiffEntry:
      type: object
      description: |-
        One RRset (owner name + type) whose records differ, with the records present
        on each side. `from` is empty for `added`, `to` for `removed`.
      required:
      - change
      - name
      - record_type
      - from
      - to
      properties:
        change:
          type: string
          description: '`added`, `removed`, or `changed`.'
          example: changed
        from:
          type: array
          items:
            $ref: '#/components/schemas/RecordDiffValue'
        name:
          type: string
          example: www.example.com.
        record_type:
          type: string
          example: A
        to:
          type: array
          items:
            $ref: '#/components/schemas/RecordDiffValue'
    RecordDiffSummary:
      type: object
      description: How many RRsets were added, removed, and changed.
      required:
      - added
      - removed
      - changed
      properties:
        added:
          type: integer
          example: 1
          minimum: 0
        changed:
          type: integer
          example: 1
          minimum: 0
        removed:
          type: integer
          example: 1
          minimum: 0
    RecordDiffValue:
      type: object
      description: |-
        One record on one side of a diff. Rendering (zone-file rdata, priority
        placement) is left to the client; the value is in display form.
      required:
      - value
      - ttl
      properties:
        priority:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        ttl:
          type: integer
          format: int32
          example: 300
        value:
          $ref: '#/components/schemas/RecordValueRequest'
    RecordItem:
      type: object
      description: |-
        A record's data fields, used both as a bulk-insertion entry and as the
        record update request body. The zone is taken from the request path, so
        unlike [`CreateRecordRequest`] it carries no `zone_name`.
      required:
      - name
      - record_type
      - value
      properties:
        name:
          type: string
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: MX and SRV priority, set here rather than inline in the value; other record types reject it.
          example: 10
        record_type:
          type: string
          example: A
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional; an omitted TTL is fixed to the zone's TTL at write time. Every record of an RRset (same name and type) must share one TTL.
          example: 3600
        value:
          $ref: '#/components/schemas/RecordValueRequest'
    RecordResponse:
      type: object
      description: A single record wrapped in a response envelope.
      required:
      - record
      properties:
        record:
          $ref: '#/components/schemas/GetRecordResponse'
    RecordValueRequest:
      oneOf:
      - type: string
        example: 192.168.1.100
      - type: array
        items:
          type: string
        example:
        - hello
        - world
      description: 'A record value as sent by the client: a single string or TXT segments.'
    RollbackSummary:
      type: object
      description: |-
        Counts of what a rollback changes. TTL-only differences count as one
        delete plus one add.
      required:
      - records_added
      - records_deleted
      - records_unchanged
      - soa_changed
      properties:
        records_added:
          type: integer
          example: 2
          minimum: 0
        records_deleted:
          type: integer
          example: 3
          minimum: 0
        records_unchanged:
          type: integer
          example: 5
          minimum: 0
        soa_changed:
          type: boolean
          example: true
    RollbackZoneRequest:
      type: object
      description: Request body for rolling a zone back to a snapshot serial.
      required:
      - serial
      properties:
        dry_run:
          type: boolean
          description: When true, compute and report the rollback without applying any change.
        serial:
          type: integer
          format: int32
          example: 7
    RollbackZoneResponse:
      type: object
      description: |-
        Result of a zone rollback. The zone's state returns to `target_serial`
        while its serial advances to `new_serial` (serials never go backward).
      required:
      - applied
      - dry_run
      - target_serial
      - new_serial
      - summary
      properties:
        applied:
          type: boolean
          example: true
        dry_run:
          type: boolean
          example: false
        new_serial:
          type: integer
          format: int32
          example: 13
        summary:
          $ref: '#/components/schemas/RollbackSummary'
        target_serial:
          type: integer
          format: int32
          example: 7
    SecondaryStatusResponse:
      type: object
      description: Sync state of one configured secondary for a zone.
      required:
      - address
      - status
      properties:
        address:
          type: string
          example: 10.0.1.10:53
        error:
          type:
          - string
          - 'null'
        status:
          type: string
          description: '`in_sync` | `lagging` | `ahead` | `unreachable`'
          example: in_sync
        visible_serial:
          type:
          - integer
          - 'null'
          format: int64
          example: 42
    SnapshotDetailResponse:
      type: object
      description: One snapshot plus the reconstructed record set at that serial.
      required:
      - snapshot
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotRecordResponse'
        snapshot:
          $ref: '#/components/schemas/ZoneSnapshotResponse'
    SnapshotDiffResponse:
      type: object
      description: The difference between two of a zone's serials.
      required:
      - from_serial
      - to_serial
      - diff
      properties:
        diff:
          $ref: '#/components/schemas/RecordDiff'
        from_serial:
          type: integer
          format: int32
          example: 41
        to_serial:
          type: integer
          format: int32
          example: 42
    SnapshotRecordResponse:
      type: object
      description: |-
        A record reconstructed from the zone's change history; unlike stored
        records it has no database id.
      required:
      - name
      - record_type
      - value
      - ttl
      properties:
        name:
          type: string
          example: www
        priority:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        record_type:
          type: string
          example: A
        ttl:
          type: integer
          format: int32
          example: 3600
        value:
          $ref: '#/components/schemas/RecordValueRequest'
    TsigKeyListResponse:
      type: object
      description: List of TSIG keys (secrets omitted).
      required:
      - tsig_keys
      properties:
        tsig_keys:
          type: array
          items:
            $ref: '#/components/schemas/GetTsigKeyResponse'
    TsigKeyResponse:
      type: object
      description: A single TSIG key wrapped in a response envelope.
      required:
      - tsig_key
      properties:
        tsig_key:
          $ref: '#/components/schemas/GetTsigKeyResponse'
    ZoneDetailResponse:
      type: object
      description: A zone together with all of its records.
      required:
      - zone
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/GetRecordResponse'
        zone:
          $ref: '#/components/schemas/GetZoneResponse'
    ZoneResponse:
      type: object
      description: A single zone wrapped in a response envelope.
      required:
      - zone
      properties:
        zone:
          $ref: '#/components/schemas/GetZoneResponse'
    ZoneSnapshotResponse:
      type: object
      description: |-
        One entry of a zone's serial history, with SOA metadata in API form
        (`admin_email` converted back from SOA mailbox form).
      required:
      - serial
      - primary_ns
      - admin_email
      - ttl
      - refresh
      - retry
      - expire
      - minimum_ttl
      - created_at
      properties:
        admin_email:
          type: string
          example: admin@example.com
        created_at:
          type: string
          format: date-time
        expire:
          type: integer
          format: int32
          example: 604800
        minimum_ttl:
          type: integer
          format: int32
          example: 3600
        primary_ns:
          type: string
          example: ns1.example.com
        refresh:
          type: integer
          format: int32
          example: 7200
        retry:
          type: integer
          format: int32
          example: 3600
        serial:
          type: integer
          format: int32
          example: 7
        ttl:
          type: integer
          format: int32
          example: 3600
    ZoneStatusResponse:
      type: object
      description: |-
        A zone's serial and the sync state of every configured secondary, probed
        live via SOA queries.
      required:
      - zone
      - serial
      - secondaries
      properties:
        secondaries:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryStatusResponse'
        serial:
          type: integer
          format: int32
          example: 42
        zone:
          type: string
          example: example.com
    ZoneTokenPolicyListResponse:
      type: object
      description: List of a zone's token policies.
      required:
      - token_policies
      properties:
        token_policies:
          type: array
          items:
            $ref: '#/components/schemas/GetZoneTokenPolicyResponse'
    ZoneTokenPolicyResponse:
      type: object
      description: A single zone token policy wrapped in a response envelope.
      required:
      - token_policy
      properties:
        token_policy:
          $ref: '#/components/schemas/GetZoneTokenPolicyResponse'
    ZoneTsigPolicyListResponse:
      type: object
      description: List of a zone's TSIG policies.
      required:
      - tsig_policies
      properties:
        tsig_policies:
          type: array
          items:
            $ref: '#/components/schemas/GetZoneTsigPolicyResponse'
    ZoneTsigPolicyResponse:
      type: object
      description: A single zone TSIG policy wrapped in a response envelope.
      required:
      - tsig_policy
      properties:
        tsig_policy:
          $ref: '#/components/schemas/GetZoneTsigPolicyResponse'
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
security:
- bearer_auth: []
tags:
- name: Health
  description: Service health probe for load balancers and orchestrators.
- name: Zone
  description: Manage DNS zones including creation, update, deletion, and retrieval.
- name: Record
  description: Manage DNS records including creation, update, deletion, and retrieval.
- name: Notify
  description: Send DNS NOTIFY messages to secondary servers.
- name: TSIG
  description: Manage TSIG keys and per-zone TSIG policies for nsupdate authentication.
- name: Token
  description: 'Per-zone API token policies: record-plane grants for scoped tokens.'
- name: ExternalDNS
  description: Provider endpoints for the ExternalDNS webhook adapter; registered only when api.external_dns_enabled is set.
