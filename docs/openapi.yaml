    post:
      tags:
      - DNSSEC
      summary: Confirm the new DS is at the parent (ds-seen)
      description: The operator's confirmation that the new DS record has been seen at the parent zone and its TTL has passed (the `ds-seen` step, as in OpenDNSSEC/BIND). Promotes the pre-published key to active and retires the key it replaces; retired keys are removed automatically once caches drain. ZSK rollovers involve no DS and are promoted automatically after a hold-down.
      operationId: ds_seen_dnssec_rollover
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: Skip the parent DS verification against dnssec.ds_probe_resolver.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Rollover advanced, new key promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '400':
          description: 'Bad request: the rollover is ZSK-only (no DS to confirm), the publish hold-down has not passed, or the parent DS is not visible at the configured resolver'
