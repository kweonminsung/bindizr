      - name: from
        in: query
        description: The serial to diff from.
        required: true
        schema:
          type: integer
          format: int32
      - name: to
        in: query
        description: The serial to diff to; defaults to the current serial.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The record differences between the two serials
          content:
            application/json:
              schema:
