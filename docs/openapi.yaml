  /zones/{name}/dnssec:
    get:
      tags:
      - DNSSEC
      summary: Get a zone's DNSSEC status
      description: Returns whether the zone is signed, the policy it signs under, its signing keys, their DS forms for the parent zone, the earliest stored signature expiration, and the zone serial. For an unsigned zone `enabled` is false with no policy and empty key and DS lists.
      operationId: get_dnssec_status
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The zone's DNSSEC status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - DNSSEC
      summary: Change a zone's DNSSEC settings
      description: 'Applies the given fields in one transaction; an omitted field keeps its value. `policy_name` moves a signed zone to another policy: the key layout must match the current policy''s (it is fixed while signed; disable and re-enable to change it), a different denial mode replaces the chain under one serial, and a different algorithm starts an algorithm rollover that double-signs the zone until the old keys are removed after promotion and cache drain (RFC 6840, Section 5.11). `parent_ns_addrs` names the parent zone''s nameservers asked for the zone''s DS, as `host[:port]` entries; the list must name at least one server, and it applies to unsigned zones too.'
      operationId: update_dnssec_settings
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDnssecSettingsRequest'
        required: true
      responses:
        '200':
          description: Settings changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '400':
          description: 'Bad request: no field given, an invalid parent address, or a policy whose key layout differs from the zone''s'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone or DNSSEC policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A policy was given for a zone without DNSSEC, or a rollover is already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type, expected JSON request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - DNSSEC
      summary: Enable DNSSEC for a zone
      description: 'Generates the zone''s signing key(s) as the named DNSSEC policy prescribes (the built-in `default` policy — an ECDSA P-256 CSK with NSEC3 denial — when `policy_name` is omitted) and signs the whole zone. The response includes the DS records to register in the parent zone. `parent_ns_addrs` is required: it names the parent zone''s nameservers that every later DS check asks.'
      operationId: enable_dnssec
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableDnssecRequest'
        required: true
      responses:
        '201':
          description: DNSSEC enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnssecStatusResponse'
        '400':
          description: Bad request, invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone or DNSSEC policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNSSEC is already enabled for the zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type, expected JSON request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - DNSSEC
      summary: Disable DNSSEC for a zone
      description: 'Deletes the zone''s signing keys and derived records, so secondaries unsign via IXFR. Dropping the signatures while the parent zone still publishes a DS makes the zone bogus, so the zone''s parent nameservers (`parent_ns_addrs`) are asked first: refused while any serves a DS for the zone (`DNSSEC_DS_PUBLISHED`) or fails to answer (`DNSSEC_DS_UNVERIFIED`). `skip_ds_check=true` skips the check; waiting out the DS TTL after its removal stays the caller''s.'
      operationId: disable_dnssec
      parameters:
      - name: name
        in: path
        description: The name of the DNS zone.
        required: true
        schema:
          type: string
      - name: skip_ds_check
        in: query
        description: Skip the parent DS check.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: DNSSEC disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's role does not permit this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNSSEC is not enabled for the zone, the parent still serves its DS, or the parent could not be asked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /zones/{name}/dnssec/check-ds:
