          $ref: '#/components/schemas/HealthStatus'
    HealthStatus:
      type: string
      description: 'Whether the API can serve requests: its database answered a probe.'
      enum:
      - healthy
      - unhealthy
    ImportMode:
      type: string
      description: How parsed records are reconciled with the records already in the zone.
      enum:
      - append
      - upsert
      - replace
    ImportSummary:
      type: object
      description: |-
        Counts of records parsed, added, deleted, updated, unchanged, and skipped
        during import. `updated` is a TTL-only reconcile and is never also counted
        as `unchanged`.
      required:
      - parsed
      - added
      - deleted
      - updated
      - unchanged
      - skipped
      properties:
        added:
          type: integer
          format: int64
          example: 8
          minimum: 0
        deleted:
          type: integer
          format: int64
          example: 2
          minimum: 0
        parsed:
          type: integer
          format: int64
          example: 12
          minimum: 0
        skipped:
          type: integer
          format: int64
          example: 0
          minimum: 0
        unchanged:
          type: integer
          format: int64
          example: 2
          minimum: 0
        updated:
          type: integer
          format: int64
          example: 1
          minimum: 0
    ImportZoneRequest:
      type: object
      description: |-
        Request body for importing records into a zone: BIND zone file text in
        `content`, or a transfer from `from_server`; exactly one of the two.
      properties:
        content:
          type:
          - string
          - 'null'
          description: Raw BIND zone file text.
          example: |
            www IN A 192.0.2.1
            mail IN A 192.0.2.2
        create:
          type: boolean
          description: |-
            Create the zone from the file's SOA when it does not exist yet.
            Without this a missing zone is an error, so a typo creates nothing.
        dry_run:
          type: boolean
          description: When true, parse and validate without applying any change.
        from_server:
          type:
          - string
          - 'null'
          description: |-
            Transfer source (`host[:port]`, port 53 default) to pull the zone
            from over AXFR; its SOA and DNSSEC-derived records are dropped.
          example: 192.0.2.1:53
        mode:
          $ref: '#/components/schemas/ImportMode'
          description: 'Reconciliation mode: `append` (default), `upsert`, or `replace`.'
          default: append
        skip_unsupported:
          type: boolean
          description: |-
            Pass over records bindizr has no type for instead of failing the whole
            file; they are counted as skipped and listed in `skipped_records`.
      additionalProperties: false
    ImportZoneResponse:
      type: object
      description: Result of a zone import, including a summary and any validation errors.
      required:
      - applied
      - dry_run
      - summary
      - diff
      - errors
      properties:
        applied:
          type: boolean
          example: true
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: The reconcile as a record diff, for previewing the change.
        dry_run:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: string
          description: Per-record validation errors. When non-empty nothing is applied.
        skipped_records:
          type: array
          items:
            type: string
          description: Records passed over under `skip_unsupported`.
        summary:
          $ref: '#/components/schemas/ImportSummary'
    MessageResponse:
      type: object
      description: Generic success message response.
      required:
      - message
      properties:
        message:
          type: string
          example: Deleted successfully
    NotifyCheckResponse:
      type: object
      description: |-
        One NOTIFY sent to a resolved address during a check; `error` is null
        when the server accepted it.
      required:
      - address
      properties:
        address:
