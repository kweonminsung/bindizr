      description: |-
        The records of one name and type that differ, with those present on
        each side. `from` is empty for `added`, `to` for `removed`.
      required:
      - change
      - name
      - type
      - from
      - to
      properties:
        change:
          $ref: '#/components/schemas/RecordChange'
        from:
          type: array
          items:
            $ref: '#/components/schemas/RecordDiffValue'
        name:
          type: string
          example: www.example.com.
        to:
          type: array
          items:
            $ref: '#/components/schemas/RecordDiffValue'
        type:
          $ref: '#/components/schemas/RecordType'
    RecordDiffSummary:
      type: object
      description: How many name-and-type groups of records were added, removed, and changed.
      required:
      - added
      - removed
      - changed
      properties:
        added:
          type: integer
          format: int64
          example: 1
          minimum: 0
        changed:
          type: integer
          format: int64
          example: 1
          minimum: 0
        removed:
          type: integer
          format: int64
          example: 1
          minimum: 0
    RecordDiffValue:
      type: object
      description: |-
        One record on one side of a diff. Rendering (zone-file rdata, priority
        placement) is left to the client; the value is in display form.
      required:
      - value
      - ttl
      properties:
        priority:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        ttl:
          type: integer
          format: int32
          example: 300
        value:
          $ref: '#/components/schemas/RecordValueRequest'
    RecordItem:
      type: object
      description: |-
        A record's data fields for a bulk insertion; the zone comes from the
        request, so unlike [`CreateRecordRequest`] it carries no `zone_name`.
      required:
      - name
      - type
      - value
      properties:
        name:
          type: string
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            MX and SRV priority, set here rather than inline in the value; other
            record types reject it. Omitted, it is served and compared as 10.
          example: 10
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional; an omitted TTL is fixed to the zone's TTL at write time. Records sharing a name and type share one TTL.
          example: 3600
        type:
          type: string
          example: A
        value:
          $ref: '#/components/schemas/RecordValueRequest'
      additionalProperties: false
    RecordResponse:
      type: object
      description: A single record wrapped in a response envelope.
      required:
      - record
      properties:
        record:
          $ref: '#/components/schemas/GetRecordResponse'
    RecordType:
      type: string
      description: The record types bindizr stores.
      enum:
      - A
      - AAAA
      - CAA
      - CNAME
      - DNAME
      - DS
      - MX
      - NAPTR
      - TXT
      - NS
      - SRV
      - PTR
      - SSHFP
      - TLSA
    RecordTypeResponse:
      oneOf:
      - $ref: '#/components/schemas/RecordType'
      - $ref: '#/components/schemas/DnssecRecordType'
      description: A user record type or a signer-generated type returned by record listing.
    RecordValueRequest:
      oneOf:
      - type: string
        example: 192.168.1.100
      - type: array
        items:
          type: string
        example:
        - hello
        - world
      description: 'A record value as sent by the client: a single string or TXT segments.'
    RecordWriteResponse:
      type: object
      description: |-
        What a record write left behind, in the shape every previewable operation
        answers with: whether it wrote, and the change as a record diff.
      required:
      - applied
      - dry_run
      - record
      - diff
      properties:
        applied:
          type: boolean
          description: Whether this call wrote; a dry run answers `false`.
          example: true
        diff:
          $ref: '#/components/schemas/RecordDiff'
          description: The write as a record diff, for previewing it.
        dry_run:
          type: boolean
          example: false
        record:
          $ref: '#/components/schemas/GetRecordResponse'
    RoleGrantResponse:
      type: object
      description: A single role grant wrapped in a response envelope.
      required:
      - role_grant
      properties:
        role_grant:
          $ref: '#/components/schemas/GetRoleGrantResponse'
    RoleResponse:
      type: object
      description: A single role wrapped in a response envelope.
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/GetRoleResponse'
    RollbackSummary:
      type: object
      description: |-
        Counts of what a rollback changes. TTL-only differences count as one
        delete plus one add.
      required:
      - added
      - deleted
      - unchanged
      - soa_changed
      properties:
        added:
          type: integer
          format: int64
          example: 2
          minimum: 0
        deleted:
          type: integer
          format: int64
          example: 3
          minimum: 0
        soa_changed:
          type: boolean
          example: true
        unchanged:
          type: integer
          format: int64
          example: 5
          minimum: 0
    RollbackZoneResponse:
      type: object
      description: |-
        Result of a zone rollback. The zone's state returns to `target_serial`
        while its serial advances to `new_serial` (serials never go backward).
      required:
      - applied
      - dry_run
      - target_serial
      - new_serial
      - summary
      properties:
        applied:
          type: boolean
          example: true
        dry_run:
          type: boolean
          example: false
        new_serial:
          type: integer
          format: int32
          example: 13
          minimum: 0
        summary:
          $ref: '#/components/schemas/RollbackSummary'
        target_serial:
          type: integer
          format: int32
          example: 7
          minimum: 0
    RolloverDnssecRequest:
      type: object
      description: Request body for starting a key rollover.
      properties:
        role:
          type:
          - string
          - 'null'
          description: |-
            Which key to roll: required for split-key zones (`ksk` or `zsk`),
            omitted for CSK zones.
          example: zsk
      additionalProperties: false
    SecondaryCheckResponse:
      type: object
      description: |-
        What a secondary answered when checked: where its address resolves, the
        catalog zone serial it serves against Bindizr's, and whether it accepted
        a NOTIFY.
      required:
      - secondary
      - addresses
      - catalog_zone_name
      - catalog
      - notifies
      - transfers
      properties:
        addresses:
          type: array
          items:
            type: string
          description: Socket addresses the registered `host[:port]` resolves to now.
          example:
          - 10.0.0.14:53
        catalog:
          $ref: '#/components/schemas/SecondaryStatusResponse'
          description: The secondary's catalog probe, classified against `catalog_serial`.
        catalog_serial:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            The serial Bindizr's own listener serves the catalog zone at; absent
            with `listener_error`, and `catalog` is then `reachable` at best.
          example: 42
          minimum: 0
        catalog_zone_name:
          type: string
          description: The catalog zone the secondary was asked for.
          example: catalog.bindizr
        listener_error:
          type:
          - string
          - 'null'
        notifies:
          type: array
          items:
            $ref: '#/components/schemas/NotifyCheckResponse'
          description: The NOTIFY sent for the catalog zone, one per resolved address.
        resolve_error:
          type:
          - string
          - 'null'
        secondary:
          $ref: '#/components/schemas/GetSecondaryResponse'
        transfers:
          $ref: '#/components/schemas/TransferSummary'
          description: How Bindizr served the secondary's transfers.
    SecondaryResponse:
      type: object
      description: A secondary wrapped in a response envelope.
      required:
      - secondary
      properties:
        secondary:
          $ref: '#/components/schemas/GetSecondaryResponse'
    SecondaryStatus:
      type: string
      description: How the serial a secondary serves compares with the one Bindizr serves.
      enum:
      - in_sync
      - lagging
      - ahead
      - reachable
      - unreachable
    SecondaryStatusResponse:
      type: object
      description: |-
        What one secondary answered when probed for a zone's SOA, classified
        against the serial Bindizr serves.
      required:
      - address
      - status
      properties:
        address:
          type: string
          example: 10.0.1.10:53
        error:
          type:
          - string
          - 'null'
        last_transfer:
          oneOf:
          - $ref: '#/components/schemas/TransferResponse'
            description: The latest transfer of this zone Bindizr served the address.
          - type: 'null'
        status:
          $ref: '#/components/schemas/SecondaryStatus'
        visible_serial:
          type:
          - integer
          - 'null'
          format: int32
          example: 42
          minimum: 0
    SecondaryTransferSummary:
      type: object
      description: One secondary's transfer summary, as `doctor` reports it.
      required:
      - secondary_name
      - address
      - summary
      properties:
        address:
          type: string
          example: ns2.example.net:53
        secondary_name:
          type: string
          example: ns2
        summary:
          $ref: '#/components/schemas/TransferSummary'
    SecondaryTransfersResponse:
      type: object
      description: The transfers Bindizr served one secondary.
      required:
      - secondary_name
      - address
      - summary
      - transfers
      properties:
        address:
          type: string
          example: ns2.example.net:53
        secondary_name:
          type: string
          example: ns2
        summary:
          $ref: '#/components/schemas/TransferSummary'
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/TransferResponse'
          description: Newest first, at most the requested `limit`.
    TokenResponse:
      type: object
      description: 'One token without its secret: the self lookup.'
      required:
      - token
      properties:
        token:
          $ref: '#/components/schemas/GetTokenResponse'
    TransferKind:
      type: string
      description: Which transfer a client asked for.
      enum:
      - axfr
      - ixfr
    TransferResponse:
      type: object
      description: One transfer Bindizr answered, refused, or failed for a secondary's address.
      required:
      - address
      - zone_name
      - kind
      - result
      - incremental
      - at
      properties:
        address:
          type: string
          description: The client address the transfer was served to.
          example: 10.0.0.14
        at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
          description: Why the transfer was refused or failed.
        incremental:
          type: boolean
          description: |-
            Whether the answer was a delta; an IXFR the journal could not serve
            went out as the whole zone.
          example: true
        kind:
          $ref: '#/components/schemas/TransferKind'
        result:
          $ref: '#/components/schemas/TransferResult'
          description: Answered, refused, or allowed and then broken off by a failure.
        serial:
          type:
          - integer
          - 'null'
          format: int32
          description: The serial the answer reached; absent when nothing was transferred.
          example: 42
          minimum: 0
        zone_name:
          type: string
          example: example.com
    TransferResult:
      type: string
      description: |-
        How a transfer request turned out: answered, refused by the ACL or the
        key's grant, or allowed and then broken off by a failure.
      enum:
      - ok
      - refused
      - failed
    TransferSummary:
      type: object
      description: How the zones a secondary asked for were last served, counted by zone.
      required:
      - zones
      - axfr
      - ixfr_full
      - ixfr_delta
      - refused
      - failed
      properties:
        axfr:
          type: integer
          format: int64
          example: 1
          minimum: 0
        failed:
          type: integer
          format: int64
          description: Allowed, then broken off by a failure.
          example: 0
          minimum: 0
        ixfr_delta:
          type: integer
          format: int64
          example: 11
          minimum: 0
        ixfr_full:
          type: integer
          format: int64
          description: IXFR asked for and the whole zone sent.
          example: 0
          minimum: 0
        refused:
          type: integer
          format: int64
          example: 0
          minimum: 0
        zones:
          type: integer
          format: int64
          example: 12
          minimum: 0
    TsigAlgorithm:
      type: string
      description: TSIG HMAC algorithms for update and transfer authentication (RFC 8945).
      enum:
      - hmac-sha256
      - hmac-sha384
      - hmac-sha512
    TsigKeyResponse:
      type: object
      description: 'A key with its secret: the create and get responses.'
      required:
      - tsig_key
      - secret
      properties:
        secret:
          type: string
          example: bXktMzItYnl0ZS1pbXBvcnQtc2VjcmV0LWV4YW1wbGU=
        tsig_key:
          $ref: '#/components/schemas/GetTsigKeyResponse'
    UpdateDnssecPolicyRequest:
      type: object
      description: |-
        Request body for editing a DNSSEC policy's timing; an omitted field keeps
        its value. Takes effect on the next signing pass or scheduler scan.
      properties:
        signature_refresh_days:
          type:
          - integer
          - 'null'
          format: int32
          example: 7
          minimum: 0
        signature_validity_days:
          type:
          - integer
          - 'null'
          format: int32
          example: 30
          minimum: 0
        zsk_lifetime_days:
          type:
          - integer
          - 'null'
          format: int32
          example: 90
          minimum: 0
      additionalProperties: false
    UpdateDnssecSettingsRequest:
      type: object
      description: |-
        Request body for changing a zone's signing settings; an omitted field
        keeps its value.
      properties:
        parent_ns_addrs:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            The parent zone's nameservers as `host[:port]` entries; must name at
            least one server.
          example:
          - a.gtld-servers.net
          - b.gtld-servers.net
        policy_name:
          type:
          - string
          - 'null'
          description: |-
            Policy to move the signed zone to; it must share the zone's key
            layout. A new denial mode replaces the chain under one serial, and a
            new algorithm starts a rollover.
          example: strict
      additionalProperties: false
    UpdateRecordRequest:
      type: object
      description: |-
        Request body for updating a record; an omitted field keeps the current
        value, merged inside the update transaction. `value` is required when
        `type` changes.
      properties:
        dry_run:
          type: boolean
          description: Validate and report the change without writing it.
          example: false
        name:
          type:
          - string
          - 'null'
          example: sub
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: MX and SRV priority; other record types reject it.
          example: 10
        ttl:
          type:
          - integer
          - 'null'
          format: int32
          description: Records sharing a name and type share one TTL.
          example: 3600
        type:
          type:
          - string
          - 'null'
          example: A
        value:
          oneOf:
          - $ref: '#/components/schemas/RecordValueRequest'
          - type: 'null'
      additionalProperties: false
    UpdateSecondaryRequest:
      type: object
      description: Request body for changing a secondary; an omitted field keeps its value.
      properties:
        address:
          type:
          - string
          - 'null'
          example: 192.0.2.7:53
        enabled:
          type:
          - boolean
          - 'null'
          description: |-
            `false` stops NOTIFY, unsigned transfers, and probes without
            forgetting the server.
          example: true
        notify_key_name:
          type:
          - string
          - 'null'
          description: TSIG key to sign NOTIFY with; empty sends it unsigned again.
          example: notify-key
      additionalProperties: false
    UpdateZoneRequest:
      type: object
      description: |-
        Request body for updating a zone; an omitted field keeps the current
        value, merged inside the update transaction. `serial` is carried only to
        be rejected: it is fixed at creation.
      properties:
        default_ttl:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        description:
          type:
          - string
          - 'null'
          description: Empty clears the note.
          example: customer A, migrated 2026-01
        dry_run:
          type: boolean
          description: Validate and report the change without writing it.
          example: false
        enabled:
          type:
          - boolean
          - 'null'
          description: '`false` stops the DNS plane serving the zone without deleting it.'
          example: true
        expire:
          type:
          - integer
          - 'null'
          format: int32
          example: 604800
        minimum_ttl:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        mname:
          type:
          - string
          - 'null'
          example: ns1.example.com
        name:
          type:
          - string
          - 'null'
          description: A different name renames the zone.
          example: example.com
        refresh:
          type:
          - integer
          - 'null'
          format: int32
          example: 7200
        retry:
          type:
          - integer
          - 'null'
          format: int32
          example: 3600
        rname:
          type:
          - string
          - 'null'
          example: admin@example.com
        serial:
          type:
          - integer
          - 'null'
          format: int32
          example: 42
          minimum: 0
      additionalProperties: false
    VersionDetailResponse:
      type: object
      description: One version plus the records rewound to that serial.
      required:
      - version
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/VersionRecordResponse'
        version:
          $ref: '#/components/schemas/ZoneVersionResponse'
    VersionDiffResponse:
      type: object
      description: The difference between two of a zone's serials.
      required:
      - from_serial
      - to_serial
      - diff
      properties:
        diff:
          $ref: '#/components/schemas/RecordDiff'
        from_serial:
          type: integer
          format: int32
          example: 41
          minimum: 0
        to_serial:
          type: integer
          format: int32
          example: 42
          minimum: 0
    VersionRecordResponse:
      type: object
      description: |-
        A record rewound from the zone's journal, named as the record
        listing names it; unlike stored records it has no database id.
      required:
      - name
      - type
      - value
      - ttl
      properties:
        name:
          type: string
          example: www.example.com.
        priority:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        ttl:
          type: integer
          format: int32
          example: 3600
        type:
          $ref: '#/components/schemas/RecordType'
        value:
          $ref: '#/components/schemas/RecordValueRequest'
    ZonePermissionsResponse:
      type: object
      description: The caller's actions in one zone that differ from its every-zone actions.
      required:
      - zone_name
      - actions
      - whole_zone
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        whole_zone:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        zone_name:
          type: string
          example: example.com
    ZoneResponse:
      type: object
      description: |-
        A single zone wrapped in a response envelope. A dry run answers with the
        zone as it would stand and `applied: false`.
      required:
      - zone
      properties:
        zone:
          $ref: '#/components/schemas/GetZoneResponse'
    ZoneStatusResponse:
      type: object
      description: |-
        A zone's serial and the sync state of every enabled secondary, probed
        live via SOA queries.
      required:
      - zone_name
      - serial
      - secondaries
      properties:
        secondaries:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryStatusResponse'
        serial:
          type: integer
          format: int32
          example: 42
          minimum: 0
        zone_name:
          type: string
          example: example.com
    ZoneVersionResponse:
      type: object
      description: |-
        One entry of a zone's serial history, with SOA metadata in API form
        (`rname` converted back from SOA mailbox form).
      required:
      - serial
      - mname
      - rname
      - default_ttl
      - refresh
      - retry
      - expire
      - minimum_ttl
      - change_source
      - created_at
      properties:
        change_source:
          $ref: '#/components/schemas/ChangeSource'
          description: The request path (`api`, `socket`, `nsupdate`) or background process (`system`).
        changed_by:
          oneOf:
          - $ref: '#/components/schemas/ChangeActor'
            description: |-
              Token or TSIG key kind and name. Null for socket commands, unauthenticated
              API requests, unsigned updates, and background work.
          - type: 'null'
        created_at:
          type: string
          format: date-time
        default_ttl:
          type: integer
          format: int32
          example: 3600
        expire:
          type: integer
          format: int32
          example: 604800
        minimum_ttl:
          type: integer
          format: int32
          example: 3600
        mname:
          type: string
          example: ns1.example.com
        refresh:
          type: integer
          format: int32
          example: 7200
        retry:
          type: integer
          format: int32
          example: 3600
        rname:
          type: string
          example: admin@example.com
        serial:
          type: integer
          format: int32
          example: 7
          minimum: 0
    ZoneWriteResponse:
      type: object
      description: |-
        What a zone write left behind. The zone's own fields are the change, so
        unlike a record write this carries no diff.
      required:
      - applied
      - dry_run
      - zone
      properties:
        applied:
          type: boolean
          description: Whether this call wrote; a dry run answers `false`.
          example: true
        dry_run:
          type: boolean
          example: false
        zone:
          $ref: '#/components/schemas/GetZoneResponse'
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
security:
- bearer_auth: []
tags:
- name: Health
  description: Service health probe for load balancers and orchestrators.
- name: Zone
  description: Manage DNS zones including creation, update, deletion, and retrieval.
- name: Record
  description: Manage DNS records including creation, update, deletion, and retrieval.
- name: Notify
  description: Send DNS NOTIFY messages to secondary servers.
- name: Secondary
  description: 'The secondary servers: each receives NOTIFY, may pull zones unsigned from its address, and is probed for the serial it serves.'
- name: TSIG
  description: Manage TSIG keys, each authenticating nsupdate and transfers into a role.
- name: Token
  description: API tokens, each authenticating into a role.
- name: Role
  description: 'Roles and their grants: the actions API tokens and TSIG keys holding a role may perform.'
- name: DNSSEC
  description: 'DNSSEC policies (the signing-parameter bundles zones sign under) and per-zone signing: enable, disable, status, DS records for the parent zone and the parent''s check of them, key rollover, and re-signing.'
- name: ExternalDNS
  description: Provider endpoints for the ExternalDNS webhook adapter; registered only when api.external_dns_enabled is set.
