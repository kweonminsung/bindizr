options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };
    recursion no;
    allow-query { any; };
    allow-notify { any; };
    dnssec-validation auto;

    ixfr-from-differences yes;
    catalog-zones {
        zone "catalog.bindizr" default-primaries { 172.28.0.10 port 853 key xot-key tls xot; };
    };
};

// Strict TLS: bindizr's certificate is checked against the stack's CA and
// its name (RFC 9103, Section 7.5).
tls xot {
    ca-file "/etc/bind/xot/ca.crt";
    remote-hostname "bindizr";
    protocols { TLSv1.3; };
};

// Over TLS bindizr requires the key beside the registered address; the
// harness creates it with this secret.
key "xot-key" {
    algorithm hmac-sha256;
    secret "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=";
};

zone "catalog.bindizr" {
    type secondary;
    primaries { 172.28.0.10 port 853 key xot-key tls xot; };
    file "/var/cache/bind/catalog.bindizr.zone";
    ixfr-from-differences yes;
};
