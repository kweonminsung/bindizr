[package]
name = "bindizr-e2e"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

[[bin]]
name = "bindizr-e2e-server"
path = "src/bin/bindizr.rs"

[[bin]]
name = "bindizr-e2e-external-dns"
path = "src/bin/external_dns.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[dependencies]
bindizr = { path = "../bindizr" }
bindizr-external-dns = { path = "../bindizr-external-dns" }
tokio.workspace = true

[dev-dependencies]
base64.workspace = true
# Sign client requests and read exported zone data independently of production code.
domain = { workspace = true, features = ["tsig", "zonefile"] }
rcgen.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
ring.workspace = true
rustls.workspace = true
serde_json.workspace = true
serial_test.workspace = true
tempfile.workspace = true

[lints]
workspace = true
