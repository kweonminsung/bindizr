# ARM override, selected by the e2e harness when BINDIZR_E2E_ARM=true.
# The ISC bind9 image is amd64-only, so the secondaries swap to the multi-arch
# ubuntu/bind9 rock. Its Pebble entrypoint takes no named flags but already
# runs `named -g` with /etc/bind/named.conf, hence `command: []`.
# Switching between the two images requires `down -v` (different named users).

services:
  bind9-1:
    image: ubuntu/bind9:9.20-26.04
    command: []

  bind9-2:
    image: ubuntu/bind9:9.20-26.04
    command: []
