[package]
name = "bindizr-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
readme = "README.md"
description = "Core models, configuration, DNS record types, and logging utilities for bindizr"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/bindizr-core"
license.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
domain = { workspace = true, features = ["tsig", "zonefile", "unstable-sign", "ring", "openssl"] }
hex.workspace = true
config.workspace = true
log.workspace = true
once_cell.workspace = true
prometheus.workspace = true
rand.workspace = true
serde.workspace = true
sha2.workspace = true
sqlx.workspace = true

[dev-dependencies]
hmac.workspace = true

[lints]
workspace = true

# musl (the release targets) has no system OpenSSL for the `domain` openssl
# backend; vendoring builds it from source for that target only.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }
