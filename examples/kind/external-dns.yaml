# ExternalDNS with the bindizr webhook adapter as a sidecar, for the
# examples/kind cluster (assumes the default namespace and the bindizr-api
# service name from values.yaml's fullnameOverride). See ../README.md for the
# full walkthrough and docs/external-dns.md for the integration reference.
#
# Requires the bindizr-external-dns Secret (api-token key) to exist — the
# token's zone grants become the ExternalDNS domain filter.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # The v0.21 service source watches EndpointSlices; without this grant the
  # informer cache never syncs and external-dns crash-loops after one minute.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          args:
            - --source=service
            - --provider=webhook
            - --registry=txt
            - --txt-owner-id=kind-test
            # kind has no cloud LB, so publish ClusterIPs instead of waiting
            # for LoadBalancer ingress IPs that never come.
            - --publish-internal-services
            - --interval=15s
        - name: bindizr-external-dns
          # On arm64 the Docker Hub image is unusable (amd64-only): build and
          # load bindizr:local as in values.arm.yaml and set pullPolicy Never.
          image: kweonminsung/bindizr:0.1.0-beta.6
          command: ["bindizr-external-dns"]
          args:
            - --bindizr-url=http://bindizr-api:8000
          env:
            - name: BINDIZR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bindizr-external-dns
                  key: api-token
          ports:
            - containerPort: 8080 # /healthz and /metrics; 8888 stays pod-local
---
# Demo target: the hostname annotation becomes an A record (its ClusterIP)
# plus an ownership TXT record in the granted zone.
apiVersion: v1
kind: Service
metadata:
  name: test-app
  annotations:
    external-dns.alpha.kubernetes.io/hostname: app.example.com
spec:
  type: ClusterIP
  ports:
    - port: 80
      protocol: TCP
