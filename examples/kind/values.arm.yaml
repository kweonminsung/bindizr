# arm64 override on top of values.yaml — the Docker Hub bindizr and ISC
# bind9 images are amd64-only. bind9 swaps to the classic multi-arch
# ubuntu/bind9 image; the newer chiselled rock tags (e.g. 9.20-26.04) ship no
# /bin/sh, which the chart's container command needs. bindizr runs a locally
# built image.
#
# Usage:
#   docker build -t bindizr:local .
#   kind load docker-image bindizr:local --name bindizr-test
#   helm install bindizr charts -f examples/kind/values.yaml -f examples/kind/values.arm.yaml

bindizr:
  image:
    repository: bindizr
    tag: local
    # kind-loaded images exist only in the node image store; a pull would fail.
    pullPolicy: Never

bind9:
  image:
    repository: ubuntu/bind9
    tag: 9.18-22.04_beta
