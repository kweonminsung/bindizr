# Helm values for the cluster.yaml test cluster. Mirrors the
# examples/compose stack settings (bundled postgres, open API, unsigned
# nsupdate); the walkthrough is in examples/README.md#kind.

fullnameOverride: bindizr

bindizr:
  api:
    authenticationRequired: false
  dns:
    nsupdateTsigRequired: false
  database:
    type: postgresql

bind9:
  service:
    # kind has no cloud LB; reach bind9 through the NodePort cluster.yaml maps
    # to the host instead.
    type: NodePort
    nodePort: 30053

postgresql:
  enabled: true
