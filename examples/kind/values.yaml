# Helm values for the cluster.yaml test cluster. Mirrors the
# examples/compose stack settings (bundled postgres, open API, unsigned
# nsupdate).
#
# Usage:
#   kind create cluster --config examples/kind/cluster.yaml
#   helm install bindizr charts -n bindizr --create-namespace -f examples/kind/values.yaml
#   # Pin the bind9 NodePort to the port cluster.yaml maps to the host
#   # (the chart does not expose nodePort in values):
#   kubectl -n bindizr patch svc bindizr-bind9 --type merge -p '{"spec":{"ports":[{"name":"dns-tcp","port":53,"targetPort":"dns-tcp","protocol":"TCP","nodePort":30053},{"name":"dns-udp","port":53,"targetPort":"dns-udp","protocol":"UDP","nodePort":30053}]}}'
#   dig -p 5300 @127.0.0.1 <zone> SOA

fullnameOverride: bindizr

bindizr:
  api:
    requireAuthentication: false
  dns:
    nsupdateAllowUnsigned: true
  database:
    type: postgresql

bind9:
  service:
    # kind has no cloud LB; reach bind9 through the pinned NodePort instead.
    type: NodePort

postgresql:
  enabled: true
