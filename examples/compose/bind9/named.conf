options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };
    recursion no;
    allow-query { any; };
    allow-notify { any; };

    ixfr-from-differences yes;
    catalog-zones {
        zone "catalog.bindizr" default-primaries { 172.28.0.10 port 53; };
    };
};

// Bindizr authorizes this secondary by address, which is what a private
// compose network needs. To sign the transfers instead, paste the output of
// `bindizr tsig-key export <name>` above and name the key here:
//
//     primaries { 172.28.0.10 port 53 key xfr-key; };
zone "catalog.bindizr" {
    type secondary;
    primaries { 172.28.0.10 port 53; };
    file "/var/cache/bind/catalog.bindizr.zone";
    ixfr-from-differences yes;
};
